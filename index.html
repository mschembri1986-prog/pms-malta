  return false;
};

    if(f.propId)q=q.eq("prop_id",f.propId);
    if(f.areaId)q=q.eq("area_id",f.areaId);
    if(f.roomId)q=q.eq("room_id",f.roomId);
    if(f.propIds&&f.propIds.length)q=q.in("prop_id",f.propIds);
    if(f.month)q=q.eq("month_label",f.month);
    const{data}=await q;return data||[];
  },
  async createEvent(d){
    const{error}=await SUPA.from("events").insert({id:"ev"+Date.now()+Math.floor(Math.random()*9999),...d});
    if(error)throw error;
  },
  async updateEvent(id,u){await SUPA.from("events").update(u).eq("id",id);},
  async getScheduleMonths(propId){
    const{data}=await SUPA.from("schedule").select("month_label,approval_status").eq("prop_id",propId);
    const map={};(data||[]).forEach(d=>{if(!map[d.month_label])map[d.month_label]=d.approval_status;});
    return map;
  },
  async getScheduleForMonth(propId,month){
    const{data}=await SUPA.from("schedule")
      .select("*,tasks(ref,name,type,est_minutes,bom,description,photo_req,charge_rate,grade),areas(name,icon),rooms(name,sub_name)")
      .eq("prop_id",propId).eq("month_label",month).order("due_date");
    return data||[];
  },
  async getTechSchedule(techId){
    const{data}=await SUPA.from("schedule")
      .select("*,tasks(ref,name,type,est_minutes,bom,description,photo_req,charge_rate,grade),areas(name,icon),rooms(name,sub_name)")
      .eq("tech_id",techId).eq("approval_status","approved").eq("status","scheduled").order("due_date");
    return data||[];
  },
  async getScheduleFallback(){
    const{data}=await SUPA.from("schedule")
      .select("*,tasks(ref,name,type,est_minutes,bom,description,photo_req,charge_rate,grade),areas(name,icon),rooms(name,sub_name)")
      .in("approval_status",["proposed","approved"]).eq("status","scheduled").order("due_date").limit(30);
    return data||[];
  },
  async approveMonth(propId,month,userId){
    await SUPA.from("schedule").update({approval_status:"approved",approved_by:userId,approved_at:new Date().toISOString()}).eq("prop_id",propId).eq("month_label",month);
  },
  async completeEntry(id){await SUPA.from("schedule").update({status:"complete"}).eq("id",id);},
  async uploadPhoto(file,path){
    const{error}=await SUPA.storage.from("visit-photos").upload(path,file,{upsert:true});
    if(error){console.error(error);return null;}
    const{data}=SUPA.storage.from("visit-photos").getPublicUrl(path);
    return data.publicUrl;
  },
  async addProperty(name,address,type){
    const id="p"+Date.now();
    await SUPA.from("properties").insert({id,name,address,type,rag:"green",room_count:0});return id;
  },
  async addArea(propId,name,icon,hasRooms){
    const id="a"+Date.now();
    await SUPA.from("areas").insert({id,prop_id:propId,name,icon:icon||"📋",has_rooms:hasRooms,rag:"green",sort_order:99});return id;
  },
  async addRoom(propId,areaId,name,subName){
    const id="r"+Date.now();
    await SUPA.from("rooms").insert({id,prop_id:propId,area_id:areaId,name,sub_name:subName,rag:"green"});return id;
  },
  async addUser(name,role,email,password,propIds){
    const id="u"+Date.now();
    const{error}=await SUPA.from("users").insert({id,name,role,email,password,prop_ids:propIds||[]});
    if(error)throw error;return id;
  },
  async addTask(d){
    const id="tk"+Date.now();
    const{error}=await SUPA.from("tasks").insert({id,...d,active:true});
    if(error)throw error;return id;
  },
};

function areaRag(events,areaId){
  const ae=events.filter(ev=>ev.area_id===areaId);
  if(ae.some(ev=>ev.rag==="red"))return"red";
  if(ae.some(ev=>ev.rag==="amber"))return"amber";
  return"green";
}
function roomRag(events,roomId){
  const re=events.filter(ev=>ev.room_id===roomId);
  if(re.some(ev=>ev.rag==="red"))return"red";
  if(re.some(ev=>ev.rag==="amber"))return"amber";
  return"green";
}

function EventCard({event:ev,showActions,onAction,showProp,propName}){
  const[state,setState]=useState(ev.quote_status&&ev.quote_status!=="none"?ev.quote_status:null);
  const act=async(val)=>{
    setState(val);
    await db.updateEvent(ev.id,{quote_status:val==="quote"?"requested":"none"});
    if(onAction)onAction();
  };
  const note=ev.note||ev.notes||"";
  const taskName=ev.title||ev.task_name||(ev.tasks&&ev.tasks.name)||"Event";
  const areaLabel=(ev.areas&&((ev.areas.icon||"")+" "+(ev.areas.name||"")))||"";
  const roomLabel=ev.rooms?(" · "+ev.rooms.name):"";
  const ragColor={red:C.red,amber:C.amber,green:C.green}[ev.rag]||C.mid;

  return e("div",{style:{borderLeft:"4px solid "+ragColor,background:C.white,borderRadius:8,padding:"12px 14px",marginBottom:10,boxShadow:"0 1px 4px rgba(0,0,0,0.06)"}},
    e("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:6,flexWrap:"wrap",gap:4}},
      e("div",{style:{display:"flex",alignItems:"center",gap:6,flexWrap:"wrap"}},
        e(RagBadge,{rag:ev.rag}),
        showProp&&propName&&e("span",{style:{fontSize:11,fontWeight:700,color:C.teal,background:C.tealL,padding:"2px 8px",borderRadius:12}},propName),
        e("span",{style:{fontSize:11,color:C.mid}},areaLabel+roomLabel),
        ev.tasks&&ev.tasks.ref&&e("span",{style:{fontSize:10,fontWeight:700,color:C.mid,background:"#F1F5F9",padding:"2px 6px",borderRadius:4}},ev.tasks.ref)),
      e("span",{style:{fontSize:11,color:C.mid,whiteSpace:"nowrap"}},ev.completed_at?ev.completed_at.slice(0,10):"")
    ),
    e("div",{style:{fontSize:14,fontWeight:700,color:C.text,marginBottom:6}},taskName),
    note&&e("div",{style:{background:"#F7F9FB",borderRadius:6,padding:"8px 10px",marginBottom:8}},
      e("div",{style:{fontSize:10,fontWeight:700,color:C.mid,textTransform:"uppercase",letterSpacing:0.5,marginBottom:4}},"Technician report"),
      e("div",{style:{fontSize:13,color:C.slate,lineHeight:1.6}},note)),
    ev.photo_urls&&ev.photo_urls.filter(u=>u).length>0&&e("div",{style:{display:"flex",gap:8,marginBottom:8,flexWrap:"wrap"}},
      ev.photo_urls.filter(u=>u).map((url,i)=>{
        const seed=(url.split("/seed/")[1]||"").split("/")[0]||("ph"+i);
        return e(MockPhoto,{key:i,seed:seed,label:taskName.slice(0,14)});
      })),
    (ev.quote_status==="approved"||ev.quote_status==="sent")&&e("div",{style:{display:"inline-flex",alignItems:"center",gap:6,padding:"4px 10px",borderRadius:20,background:C.greenL,color:C.green,fontSize:12,fontWeight:700,marginBottom:6}},"✓ Quote approved — works completed"),
    ev.quote_status==="requested"&&e("div",{style:{display:"inline-flex",alignItems:"center",gap:6,padding:"4px 10px",borderRadius:20,background:C.amberL,color:C.amber,fontSize:12,fontWeight:700,marginBottom:6}},"⏳ Quote requested — awaiting PMS response"),
    showActions&&ev.rag!=="green"&&(!state||state==="none")&&e("div",{style:{display:"flex",gap:8,marginTop:8}},
      e(Btn,{small:true,variant:"ghost",onClick:()=>act("ack")},"Noted — no action"),
      e(Btn,{small:true,variant:"secondary",onClick:()=>act("quote")},"Request quote")),
    showActions&&state&&state!=="none"&&ev.rag!=="green"&&e("div",{style:{padding:"6px 12px",borderRadius:6,background:state==="quote"||state==="requested"?C.amberL:C.greenL,color:state==="quote"||state==="requested"?C.amber:C.green,fontSize:12,fontWeight:600,display:"inline-block",marginTop:6}},
      state==="quote"||state==="requested"?"✓ Quote requested — PMS Malta will be in touch":"✓ Noted"),
    ev.rag==="green"&&e("div",{style:{marginTop:4}},e("span",{style:{fontSize:12,color:C.green,fontWeight:700}},"✓ Satisfactory — no action required")));
}

// Demo-mode db override
function makeDemoDb(){
  // Compute RAG for each area from events
  function areaRagFromEvents(propId,areaId){
    const ev=DEMO_EVENTS.filter(e=>e.prop_id===propId&&e.area_id===areaId);
    if(ev.some(e=>e.rag==="red"))return"red";
    if(ev.some(e=>e.rag==="amber"))return"amber";
    return"green";
  }
  function propRagFromEvents(propId){
    const ev=DEMO_EVENTS.filter(e=>e.prop_id===propId);
    if(ev.some(e=>e.rag==="red"))return"red";
    if(ev.some(e=>e.rag==="amber"))return"amber";
    return"green";
  }
  return{
    async login(email){
      const u=DEMO_USERS[email];
      return{data:u||null,error:u?null:{message:"Not found"}};
    },
    async getProperties(ids){
      const ps=ids&&ids.length?DEMO_PROPS.filter(p=>ids.includes(p.id)):DEMO_PROPS;
      return ps.map(p=>({...p,rag:propRagFromEvents(p.id)}));
    },
    async getEvents(f){
      f=f||{};
      let ev=[...DEMO_EVENTS];
      if(f.propId)ev=ev.filter(e=>e.prop_id===f.propId);
      if(f.propIds&&f.propIds.length)ev=ev.filter(e=>f.propIds.includes(e.prop_id));
      if(f.areaId)ev=ev.filter(e=>e.area_id===f.areaId);
      if(f.roomId)ev=ev.filter(e=>e.room_id===f.roomId);
      if(f.month)ev=ev.filter(e=>e.month_label===f.month);
      return ev.sort((a,b)=>b.completed_at.localeCompare(a.completed_at));
    },
    async getAreas(propId){
      const arList=DEMO_AREAS[propId]||[{id:"da_gen",prop_id:propId,name:"All Areas",icon:"🏠",has_rooms:false,sort_order:1,rag:"green"}];
      return arList.map(a=>({...a,rag:areaRagFromEvents(propId,a.id)}));
    },
    async getRooms(){return[];},
    async getTasksForArea(){return[];},
    async getScheduleMonths(propId){return DEMO_SCHEDULE[propId]||{};},
    async getScheduleForMonth(){return[];},
    async getTechSchedule(){return[];},
    async getScheduleFallback(){return[];},
    async getUsers(){return Object.values(DEMO_USERS);},
    async updateEvent(id,u){
      const ev=DEMO_EVENTS.find(e=>e.id===id);
      if(ev)Object.assign(ev,u);
    },
    async approveMonth(){},
    async createEvent(){},
    async completeEntry(){},
    async uploadPhoto(){return null;},
    async addProperty(){return"dp_new";},
    async addArea(){return"da_new";},
    async addRoom(){return"dr_new";},
    async addUser(){return"du_new";},
    async addTask(){return"dtk_new";},
  };
}

    "May '27":"6 May 2027","Jun '27":"3 Jun 2027","Jul '27":"1 Jul 2027","Aug '27":"5 Aug 2027","Sep '27":"3 Sep 2027",
    // Apartments — quarterly
    "Dec '25":"3 Dec 2025","Mar '26":"4 Mar 2026","Jun '26":"3 Jun 2026",
  };

      "Tap a month to review planned works. Approve to confirm the visit."),

    // Month grid — sorted Oct 2026 first
    e("div",{style:{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:8,marginBottom:20}},

        months[selMonth]==="draft"&&e("span",{style:{fontSize:12,color:C.mid,fontStyle:"italic"}},"Being prepared by PMS Malta")),

            e("span",{style:{fontSize:24}},group.icon),
            e("div",{style:{flex:1}},
              e("div",{style:{fontWeight:700,fontSize:15,color:C.text}},group.name),
              e("div",{style:{fontSize:12,color:C.mid,marginTop:2}},
                isGuestRooms&&roomList.length>0

            e("span",{style:{fontSize:20,color:C.teal,fontWeight:700,display:"inline-block",
              transform:isOpen?"rotate(90deg)":"none",transition:"transform .2s",flexShrink:0}},"›")),

          // Expanded content
          isOpen&&e("div",{style:{borderTop:"1px solid "+C.line,padding:"12px 16px"}},
            // Guest rooms: show rooms grouped by floor then tasks
            isGuestRooms&&roomList.length>0&&e("div",null,
              e("div",{style:{fontSize:11,fontWeight:700,color:C.mid,marginBottom:8,textTransform:"uppercase",letterSpacing:0.5}},"Rooms included this visit"),
              (()=>{
                // Group rooms by floor
                const floors={};
                roomList.forEach(room=>{
                  const num=room.name.replace("Room ","");

    doc+="</body></html>";

    var w=window.open("","_blank");
    if(w){w.document.write(doc);w.document.close();setTimeout(function(){w.print();},600);}
  };

  if(loading)return e(Spin,null);
  const allMonths=[...new Set(events.map(ev=>ev.month_label).filter(Boolean))].sort((a,b)=>{
    const parse=s=>{const[mon,yr]=s.split(" '");const mi=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"].indexOf(mon);return parseInt("20"+yr)*12+mi;};
    return parse(a)-parse(b);
  });
  const filtEvs=selProp==="all"?events:events.filter(ev=>ev.prop_id===selProp);
  const months=[...new Set(filtEvs.map(ev=>ev.month_label).filter(Boolean))];
  const monthEvents=selMonth?filtEvs.filter(ev=>ev.month_label===selMonth):[];

  return e("div",null,
    e(SectionHead,{title:"Reports",sub:"PPM inspection reports by property and month",
      action:selMonth?e(Btn,{variant:"ghost",small:true,onClick:()=>setSelMonth(null)},"← Back"):null}),

    // Property filter pills
    !selMonth&&e("div",{style:{display:"flex",gap:8,marginBottom:14,overflowX:"auto",paddingBottom:4}},
      e("button",{onClick:()=>setSelProp("all"),
        style:{padding:"7px 14px",borderRadius:20,border:"1.5px solid "+(selProp==="all"?C.teal:C.line),
          background:selProp==="all"?C.teal:C.white,color:selProp==="all"?C.white:C.mid,
          fontSize:12,fontWeight:600,cursor:"pointer",whiteSpace:"nowrap"}},"All properties"),
      props.map(p=>e("button",{key:p.id,onClick:()=>setSelProp(p.id),
        style:{padding:"7px 14px",borderRadius:20,border:"1.5px solid "+(selProp===p.id?C.teal:C.line),
          background:selProp===p.id?C.teal:C.white,color:selProp===p.id?C.white:C.mid,
          fontSize:12,fontWeight:600,cursor:"pointer",whiteSpace:"nowrap"}},p.name))),

    !selMonth&&e("div",null,
      months.length===0&&e(Card,null,e("div",{style:{textAlign:"center",padding:32,color:C.mid}},"No reports available.")),
      months.map(m=>{
        const me=filtEvs.filter(ev=>ev.month_label===m);
        // Group by property for summary
        const propSummary={};
        me.forEach(ev=>{if(!propSummary[ev.prop_id])propSummary[ev.prop_id]={name:(props.find(p=>p.id===ev.prop_id)||{}).name||ev.prop_id,red:0,amber:0,green:0};propSummary[ev.prop_id][ev.rag]=(propSummary[ev.prop_id][ev.rag]||0)+1;});
        return e(Card,{key:m,style:{marginBottom:14}},
          e("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}},
            e("div",{style:{fontSize:16,fontWeight:800}},m),
            e("div",{style:{display:"flex",gap:8}},
              e(Btn,{variant:"secondary",small:true,onClick:()=>setSelMonth(m)},"View events"),
              e(Btn,{variant:"ghost",small:true,onClick:()=>printReport(m,selProp)},"🖨 Print report"))),
          // Per-property summary
          Object.values(propSummary).map(ps=>e("div",{key:ps.name,style:{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"6px 0",borderBottom:"1px solid "+C.line}},
            e("span",{style:{fontSize:12,fontWeight:700,color:C.text}},ps.name),
            e("div",{style:{display:"flex",gap:10,fontSize:11}},
              e("span",{style:{color:C.red}},"✕ "+ps.red),
              e("span",{style:{color:C.amber}},"⚠ "+ps.amber),
              e("span",{style:{color:C.green}},"✓ "+ps.green)))));
      })),

    selMonth&&e("div",null,
      e("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14,flexWrap:"wrap",gap:8}},
        e("div",null,
          e("div",{style:{fontWeight:800,fontSize:18}},selMonth),
          e("div",{style:{fontSize:12,color:C.mid}},monthEvents.length+" events · "+(selProp==="all"?"all properties":(props.find(p=>p.id===selProp)||{}).name||""))),
        e(Btn,{variant:"primary",onClick:()=>printReport(selMonth,selProp)},"🖨 Print / Save PDF")),

      // Group by property then area
      e(ReportEventList,{monthEvents,props})));
}

// ── NAV CONFIG ─────────────────────────────────────────────────────────────
const NAVS={
  admin:[{id:"a_dash",l:"Dashboard",i:"⊞"},{id:"a_cal",l:"Schedule",i:"📅"},{id:"a_events",l:"Events",i:"⚑"},{id:"a_manage",l:"Manage",i:"⚙️"}],
  tech: [{id:"t_dash",l:"My schedule",i:"📋"}],
  owner:[{id:"o_dash",l:"Properties",i:"🏨"},{id:"o_sched",l:"Schedule",i:"📅"},{id:"o_pend",l:"Actions",i:"⚑"},{id:"o_rep",l:"Reports",i:"📊"}],
};
const PCOL={admin:C.teal,tech:"#6366F1",owner:C.amber};

// ── APP ROOT ───────────────────────────────────────────────────────────────
function App(){
  const[user,setUser]=useState(null);
  const[view,setView]=useState({page:"a_dash"});
  const[menu,setMenu]=useState(false);
  const login=u=>{
    if(u._demoDb){Object.assign(db,u._demoDb);delete u._demoDb;}
    setUser(u);const d={admin:"a_dash",tech:"t_dash",owner:"o_dash"};setView({page:d[u.role]});
  };
  const logout=()=>{setUser(null);setView({page:"a_dash"});};
  if(!user)return e(Login,{onLogin:login});
  const nav=NAVS[user.role]||[];const pc=PCOL[user.role];
  const isActive=nid=>{
    if(nid==="a_dash"&&(view.page.startsWith("a_prop")||view.page.startsWith("a_area")||view.page.startsWith("a_room")))return true;
    if(nid==="o_dash"&&(view.page.startsWith("o_prop")||view.page.startsWith("o_area")||view.page.startsWith("o_room")))return true;
    if(nid==="t_dash"&&view.page.startsWith("t_"))return true;
    return view.page===nid;
  };
  const content=()=>{
    switch(view.page){
      case"a_dash":   return e(AdminDash,{setView});
      case"a_prop":   return e(AdminProp,{propId:view.propId,setView});
      case"a_area":   return e(AdminArea,{propId:view.propId,areaId:view.areaId,setView});
      case"a_room":   return e(AdminRoom,{propId:view.propId,areaId:view.areaId,roomId:view.roomId,setView});
      case"a_cal":    return e(AdminCal,null);
      case"a_events": return e(AdminEvents,null);
      case"a_manage": return e(AdminManage,null);
      case"t_dash":   return e(TechDash,{user,setView});
      case"t_visit":  return e(TechVisit,{date:view.date,tasks:view.tasks,user,setView});
      case"o_dash":   return e(OwnerDash,{user,setView});
      case"o_prop":   return e(OwnerProp,{user,propId:view.propId,setView});
      case"o_area":   return e(OwnerArea,{user,propId:view.propId,areaId:view.areaId,setView});
      case"o_room":   return e(OwnerRoom,{user,propId:view.propId,areaId:view.areaId,roomId:view.roomId,setView});
      case"o_sched":  return e(OwnerSchedule,{user});
      case"o_pend":   return e(OwnerPending,{user});
      case"o_rep":    return e(OwnerReports,{user});
      default:return null;
    }
  };
  return e("div",{style:{fontFamily:"-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif",background:C.bg,minHeight:"100vh",display:"flex",flexDirection:"column"}},
    e("div",{style:{background:C.nav,padding:"0 16px",display:"flex",alignItems:"center",height:50,position:"sticky",top:0,zIndex:100}},
      e("button",{onClick:()=>setMenu(!menu),style:{background:"none",border:"none",color:C.white,fontSize:20,cursor:"pointer",marginRight:12,padding:"0 4px"}},"☰"),
      e("div",{style:{color:C.white,fontWeight:800,fontSize:15,letterSpacing:-0.5,flex:1}},"PMS Malta"),
      e("div",{style:{padding:"3px 10px",borderRadius:20,background:pc,color:C.white,fontSize:11,fontWeight:600,marginRight:12}},user.role.charAt(0).toUpperCase()+user.role.slice(1)),
      e("button",{onClick:logout,style:{background:"rgba(255,255,255,0.1)",border:"none",color:"rgba(255,255,255,0.8)",padding:"4px 10px",borderRadius:6,fontSize:11,cursor:"pointer"}},"Sign out")),
    menu&&e("div",{style:{position:"fixed",top:50,left:0,bottom:0,right:0,zIndex:200,display:"flex"}},
      e("div",{style:{width:220,background:C.nav,padding:"20px 12px",overflowY:"auto"}},
        e("div",{style:{fontSize:10,fontWeight:700,color:"rgba(255,255,255,0.3)",marginBottom:10,paddingLeft:8,textTransform:"uppercase",letterSpacing:1}},user.role+" portal"),
        nav.map(n=>{const active=isActive(n.id);return e("button",{key:n.id,onClick:()=>{setView({page:n.id});setMenu(false);},style:{display:"flex",alignItems:"center",gap:10,width:"100%",padding:"10px 8px",borderRadius:7,border:"none",cursor:"pointer",marginBottom:4,background:active?"rgba(255,255,255,0.12)":"transparent",color:active?C.white:"rgba(255,255,255,0.55)",fontSize:14,fontWeight:active?600:400,textAlign:"left"}},e("span",{style:{fontSize:16}},n.i),n.l);}),
        e("div",{style:{marginTop:20,borderTop:"1px solid rgba(255,255,255,0.1)",paddingTop:16}},
          e("div",{style:{fontSize:11,color:"rgba(255,255,255,0.4)",padding:"6px 8px"}},user.name),
          e("div",{style:{fontSize:11,color:"rgba(255,255,255,0.3)",padding:"0 8px 6px"}},user.email))),
      e("div",{style:{flex:1,background:"rgba(0,0,0,0.4)"},onClick:()=>setMenu(false)})),
    e("div",{style:{flex:1,padding:16,overflowY:"auto"}},content()),
    e("div",{style:{background:C.nav,display:"flex",borderTop:"1px solid rgba(255,255,255,0.1)",position:"sticky",bottom:0}},
      nav.map(n=>{const active=isActive(n.id);return e("button",{key:n.id,onClick:()=>setView({page:n.id}),style:{flex:1,padding:"10px 0",background:"transparent",border:"none",cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",gap:3}},
        e("span",{style:{fontSize:18}},n.i),e("span",{style:{fontSize:9,color:active?pc:"rgba(255,255,255,0.4)",fontWeight:active?700:400}},n.l));})));
}

ReactDOM.createRoot(document.getElementById("root")).render(e(App,null));
</script>
</body>
</html>
