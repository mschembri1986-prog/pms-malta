<div id="root"></div>
<script>
const SUPA = supabase.createClient(
  "https://ingmfhuyyhlsdptuebpa.supabase.co",
  "sb_publishable_TKSTjRCws76fU9mBJtiCLw_-PdqKM0l"
);
</script>
<script type="text/babel">
const { useState, useEffect } = React;

const C = {
  nav:"#0F1923", teal:"#1A7A6E", tealL:"#E6F4F2",
  amber:"#D4920A", amberL:"#FEF7E6", red:"#C0392B", redL:"#FDECEA",
  green:"#1A7A4A", greenL:"#E6F5ED", mid:"#64748B",
  line:"#E2E8F0", bg:"#F7F9FB", white:"#FFFFFF", text:"#0F1923", slate:"#2C3E50",
};
const RAG = {
  green:{ bg:C.greenL, text:C.green, border:C.green, dot:C.green, label:"Good" },
  amber:{ bg:C.amberL, text:C.amber, border:C.amber, dot:C.amber, label:"Attention" },
  red:  { bg:C.redL,   text:C.red,   border:C.red,   dot:C.red,   label:"Urgent" },
};

// ── DATABASE LAYER ─────────────────────────────────────────────────────────
const db = {
  async login(email,password) {
    const {data,error} = await SUPA.from("users").select("*").eq("email",email).eq("password",password).single();
    return {data,error};
  },
  async getProperties(ids) {
    let q = SUPA.from("properties").select("*");
    if(ids&&ids.length) q=q.in("id",ids);
    const {data}=await q; return data||[];
  },
  async getAreas(propId) {
    const {data}=await SUPA.from("areas").select("*").eq("prop_id",propId).order("sort_order");
    return data||[];
  },
  async getRooms(propId,areaId) {
    const {data}=await SUPA.from("rooms").select("*").eq("prop_id",propId).eq("area_id",areaId);
    return data||[];
  },
  async getUsers() {
    const {data}=await SUPA.from("users").select("*"); return data||[];
  },

  // Tasks — linked to prop+area+room
  async getTasksForArea(propId,areaId) {
    const {data}=await SUPA.from("tasks").select("*")
      .eq("prop_id",propId).eq("area_id",areaId).is("room_id",null).eq("active",true);
    return data||[];
  },
  async getAllTasks(propId) {
    const {data}=await SUPA.from("tasks").select("*").eq("prop_id",propId).eq("active",true);
    return data||[];
  },

  // Schedule
  async getSchedule(filters={}) {
    let q=SUPA.from("schedule").select("*, tasks(ref,name,est_minutes,bom,type,charge_rate,grade,photo_req,description), areas(name,icon), rooms(name,sub_name)").order("due_date");
    if(filters.propId)  q=q.eq("prop_id",filters.propId);
    if(filters.techId)  q=q.eq("tech_id",filters.techId);
    if(filters.areaId)  q=q.eq("area_id",filters.areaId);
    if(filters.month)   q=q.eq("month_label",filters.month);
    if(filters.status)  q=q.eq("status",filters.status);
    const {data}=await q; return data||[];
  },
  async getScheduleMonths(propId) {
    const {data}=await SUPA.from("schedule").select("month_label").eq("prop_id",propId);
    const unique=[...new Set((data||[]).map(d=>d.month_label))];
    return unique;
  },
  async assignTech(scheduleId,techId) {
    await SUPA.from("schedule").update({tech_id:techId}).eq("id",scheduleId);
  },

  // Events — created when tech completes a task
  async getEvents(filters={}) {
    let q=SUPA.from("events").select("*, tasks(ref,name,type,charge_rate), areas(name,icon), rooms(name)").order("completed_at",{ascending:false});
    if(filters.propId)  q=q.eq("prop_id",filters.propId);
    if(filters.areaId)  q=q.eq("area_id",filters.areaId);
    if(filters.roomId)  q=q.eq("room_id",filters.roomId);
    if(filters.propIds) q=q.in("prop_id",filters.propIds);
    if(filters.month)   q=q.eq("month_label",filters.month);
    if(filters.rag)     q=q.eq("rag",filters.rag);
    const {data}=await q; return data||[];
  },
  async createEvent(eventData) {
    const {error}=await SUPA.from("events").insert({
      id: "ev"+Date.now()+Math.floor(Math.random()*1000),
      ...eventData
    });
    if(error) throw error;
  },
  async updateEvent(id,updates) {
    await SUPA.from("events").update(updates).eq("id",id);
  },
  async completeScheduleEntry(id) {
    await SUPA.from("schedule").update({status:"complete"}).eq("id",id);
  },

  // Photo upload
  async uploadPhoto(file,path) {
    const {error}=await SUPA.storage.from("visit-photos").upload(path,file,{upsert:true});
    if(error){console.error(error);return null;}
    const {data}=SUPA.storage.from("visit-photos").getPublicUrl(path);
    return data.publicUrl;
  },

  // Admin — add records
  async addProperty(name,address,type) {
    const id="p"+Date.now();
    await SUPA.from("properties").insert({id,name,address,type,rag:"green",room_count:0});
    return id;
  },
  async addArea(propId,name,icon,hasRooms) {
    const id="a"+Date.now();
    await SUPA.from("areas").insert({id,prop_id:propId,name,icon:icon||"📋",has_rooms:hasRooms,rag:"green",sort_order:99});
    return id;
  },
  async addRoom(propId,areaId,name,subName) {
    const id="r"+Date.now();
    await SUPA.from("rooms").insert({id,prop_id:propId,area_id:areaId,name,sub_name:subName,rag:"green"});
    return id;
  },
  async addUser(name,role,email,password) {
    const id="u"+Date.now();
    const {error}=await SUPA.from("users").insert({id,name,role,email,password,prop_ids:[]});
    if(error) throw error;
    return id;
  },
  async addTask(data) {
    const id="tk"+Date.now();
    const {error}=await SUPA.from("tasks").insert({id,...data,active:true});
    if(error) throw error;
    return id;
  },
};

// ── SHARED UI ──────────────────────────────────────────────────────────────
const RagDot=({rag,size=10})=><span style={{display:"inline-block",width:size,height:size,borderRadius:"50%",background:RAG[rag]?.dot||C.mid,flexShrink:0}}/>;

const RagBadge=({rag})=>rag&&RAG[rag]?(
  <span style={{display:"inline-flex",alignItems:"center",gap:5,padding:"3px 10px",borderRadius:20,background:RAG[rag].bg,color:RAG[rag].text,fontSize:11,fontWeight:600,border:"1px solid "+RAG[rag].border,whiteSpace:"nowrap"}}>
    <RagDot rag={rag} size={7}/>{RAG[rag].label}
  </span>
):null;

const StatusBadge=({status})=>{
  const m={pending:{bg:"#F1F5F9",c:"#64748B",l:"Pending"},acknowledged:{bg:C.greenL,c:C.green,l:"Noted"},
    none:{bg:"#F1F5F9",c:C.mid,l:"No action"},requested:{bg:C.amberL,c:C.amber,l:"Quote requested"},
    sent:{bg:C.tealL,c:C.teal,l:"Quote sent"},approved:{bg:C.greenL,c:C.green,l:"Approved"},
    rejected:{bg:C.redL,c:C.red,l:"Rejected"},complete:{bg:C.greenL,c:C.green,l:"Complete"},
    scheduled:{bg:C.tealL,c:C.teal,l:"Scheduled"},skipped:{bg:"#F1F5F9",c:C.mid,l:"Skipped"}};
  const s=m[status]||m.pending;
  return <span style={{padding:"2px 9px",borderRadius:20,background:s.bg,color:s.c,fontSize:11,fontWeight:600}}>{s.l}</span>;
};

const TypeBadge=({type})=>{
  const m={elec:"Electrical",hydro:"Water/Legionella",hvac:"HVAC",misc:"General",fire:"Fire",pest:"Pest",pool:"Pool"};
  return <span style={{padding:"2px 8px",borderRadius:4,background:"#EFF3F8",color:C.slate,fontSize:11}}>{m[type]||type}</span>;
};

const Card=({children,style={},onClick})=>(
  <div onClick={onClick} style={{background:C.white,border:"1px solid "+C.line,borderRadius:10,padding:16,cursor:onClick?"pointer":"default",...style}}>{children}</div>
);

const SectionHead=({title,sub,action,back})=>(
  <div style={{marginBottom:20}}>
    {back&&<button onClick={back} style={{background:"none",border:"none",color:C.teal,fontSize:13,cursor:"pointer",padding:"0 0 8px 0",display:"block"}}>← Back</button>}
    <div style={{display:"flex",alignItems:"flex-start",justifyContent:"space-between"}}>
      <div><div style={{fontSize:19,fontWeight:700,color:C.text}}>{title}</div>
      {sub&&<div style={{fontSize:12,color:C.mid,marginTop:2}}>{sub}</div>}</div>
      {action}
    </div>
  </div>
);

const Btn=({children,onClick,variant="primary",small=false,full=false,disabled=false})=>{
  const s={primary:{background:C.teal,color:C.white,border:"none"},
    secondary:{background:C.white,color:C.teal,border:"1.5px solid "+C.teal},
    ghost:{background:"transparent",color:C.mid,border:"1px solid "+C.line},
    danger:{background:C.red,color:C.white,border:"none"},
    amber:{background:C.amberL,color:C.amber,border:"1px solid "+C.amber}};
  return <button onClick={onClick} disabled={disabled} style={{...s[variant],padding:small?"5px 12px":"8px 18px",borderRadius:7,fontSize:small?12:13,fontWeight:600,cursor:disabled?"not-allowed":"pointer",opacity:disabled?.5:1,display:"inline-flex",alignItems:"center",gap:6,width:full?"100%":"auto",justifyContent:full?"center":"flex-start"}}>{children}</button>;
};

const StatBox=({label,value,rag,loading})=>(
  <div style={{textAlign:"center",padding:"12px 0"}}>
    <div style={{fontSize:28,fontWeight:700,color:rag?RAG[rag].text:C.teal}}>{loading?"…":value}</div>
    <div style={{fontSize:11,color:C.mid,marginTop:3}}>{label}</div>
  </div>
);

const Grid=({cols=2,children,gap=10})=>(
  <div style={{display:"grid",gridTemplateColumns:"repeat("+cols+",1fr)",gap}}>{children}</div>
);

const Spinner=()=><div style={{textAlign:"center",padding:40,color:C.mid,fontSize:14}}>Loading…</div>;

const Inp=({label,value,onChange,placeholder,type="text",rows})=>(<div style={{marginBottom:12}}>
  {label&&<label style={{fontSize:11,fontWeight:600,color:C.slate,display:"block",marginBottom:4}}>{label}</label>}
  {rows?<textarea value={value} onChange={e=>onChange(e.target.value)} placeholder={placeholder} rows={rows}
    style={{width:"100%",padding:"8px 12px",borderRadius:7,border:"1px solid "+C.line,fontSize:13,outline:"none",resize:"vertical",fontFamily:"inherit"}}/>
  :<input value={value} onChange={e=>onChange(e.target.value)} placeholder={placeholder} type={type}
    style={{width:"100%",padding:"8px 12px",borderRadius:7,border:"1px solid "+C.line,fontSize:13,outline:"none"}}/>}
</div>);

const Sel=({label,value,onChange,options})=>(<div style={{marginBottom:12}}>
  {label&&<label style={{fontSize:11,fontWeight:600,color:C.slate,display:"block",marginBottom:4}}>{label}</label>}
  <select value={value} onChange={e=>onChange(e.target.value)}
    style={{width:"100%",padding:"8px 12px",borderRadius:7,border:"1px solid "+C.line,fontSize:13,outline:"none",background:"white"}}>
    {options.map(o=><option key={o.v} value={o.v}>{o.l}</option>)}
  </select>
</div>);

// ── LOGIN ──────────────────────────────────────────────────────────────────
function Login({onLogin}) {
  const [email,setEmail]=useState("");
  const [pass,setPass]=useState("");
  const [err,setErr]=useState("");
  const [loading,setLoading]=useState(false);

  const attempt=async()=>{
    if(!email||!pass){setErr("Please enter email and password.");return;}
    setErr("");setLoading(true);
    const {data,error}=await db.login(email,pass);
    if(data) onLogin(data); else {setErr("Incorrect email or password.");setLoading(false);}
  };

  return (
    <div style={{minHeight:"100vh",background:C.nav,display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
      <div style={{background:C.white,borderRadius:16,padding:36,width:"100%",maxWidth:380}}>
        <div style={{textAlign:"center",marginBottom:28}}>
          <div style={{fontSize:26,fontWeight:800,color:C.teal,letterSpacing:-1}}>PMS Malta</div>
          <div style={{fontSize:12,color:C.mid,marginTop:4}}>Preventive Maintenance Services</div>
        </div>
        <Inp label="Email" value={email} onChange={setEmail} placeholder="you@example.com" type="email"/>
        <Inp label="Password" value={pass} onChange={setPass} placeholder="••••••••" type="password"/>
        {err&&<div style={{marginBottom:12,padding:"8px 12px",background:C.redL,color:C.red,borderRadius:6,fontSize:13}}>{err}</div>}
        <Btn onClick={attempt} full disabled={loading}>{loading?"Signing in…":"Sign in"}</Btn>
        <div style={{marginTop:20,fontSize:11,color:C.mid,textAlign:"center"}}>Contact your administrator if you need access.</div>
      </div>
    </div>
  );
}

// ── ADMIN DASHBOARD ────────────────────────────────────────────────────────
function AdminDash({setView}) {
  const [props,setProps]=useState([]);
  const [events,setEvents]=useState([]);
  const [schedule,setSchedule]=useState([]);
  const [loading,setLoading]=useState(true);

  useEffect(()=>{
    Promise.all([db.getProperties(),db.getEvents(),db.getSchedule({status:"scheduled"})]).then(([p,e,s])=>{
      setProps(p);setEvents(e);setSchedule(s);setLoading(false);
    });
  },[]);

  if(loading) return <Spinner/>;
  const reds=events.filter(e=>e.rag==="red").length;
  const ambers=events.filter(e=>e.rag==="amber").length;
  const upcoming=schedule.slice(0,5);

  return (
    <div>
      <SectionHead title="Dashboard" sub="All properties · current status"/>
      <Grid cols={4} gap={10}>
        <Card><StatBox label="Properties" value={props.length}/></Card>
        <Card><StatBox label="Events this month" value={events.length}/></Card>
        <Card><StatBox label="Urgent" value={reds} rag="red"/></Card>
        <Card><StatBox label="Attention" value={ambers} rag="amber"/></Card>
      </Grid>
      <div style={{height:14}}/>
      {props.map(p=>(
        <Card key={p.id} onClick={()=>setView({page:"a_prop",propId:p.id})} style={{marginBottom:12}}>
          <div style={{display:"flex",justifyContent:"space-between",marginBottom:8}}>
            <div><div style={{fontWeight:700,fontSize:15}}>{p.name}</div>
            <div style={{fontSize:12,color:C.mid}}>{p.type} · {p.room_count} rooms</div></div>
            <RagBadge rag={p.rag}/>
          </div>
        </Card>
      ))}
      <Card style={{marginTop:4}}>
        <div style={{fontWeight:700,fontSize:14,marginBottom:12}}>Upcoming scheduled visits</div>
        {upcoming.length?upcoming.map(s=>(
          <div key={s.id} style={{display:"flex",alignItems:"center",gap:10,padding:"8px 0",borderBottom:"1px solid "+C.line,flexWrap:"wrap"}}>
            <div style={{minWidth:90,fontSize:12,fontWeight:600,color:C.teal}}>{s.due_date}</div>
            <div style={{flex:1}}>
              <div style={{fontSize:13,fontWeight:600}}>{s.tasks?.name}</div>
              <div style={{fontSize:11,color:C.mid}}>{s.areas?.icon} {s.areas?.name} {s.rooms?"· "+s.rooms.name:""}</div>
            </div>
            <TypeBadge type={s.tasks?.type}/>
          </div>
        )):<div style={{fontSize:13,color:C.mid}}>No upcoming visits.</div>}
      </Card>
    </div>
  );
}

// ── ADMIN PROPERTY ─────────────────────────────────────────────────────────
function AdminProp({propId,setView}) {
  const [prop,setProp]=useState(null);
  const [areas,setAreas]=useState([]);
  const [events,setEvents]=useState([]);
  const [loading,setLoading]=useState(true);

  useEffect(()=>{
    Promise.all([db.getProperties([propId]),db.getAreas(propId),db.getEvents({propId})]).then(([ps,a,e])=>{
      setProp(ps[0]);setAreas(a);setEvents(e);setLoading(false);
    });
  },[propId]);

  if(loading) return <Spinner/>;
  if(!prop) return null;
  return (
    <div>
      <SectionHead title={prop.name} sub={prop.address} action={<RagBadge rag={prop.rag}/>} back={()=>setView({page:"a_dash"})}/>
      <Grid cols={4} gap={10}>
        <Card><StatBox label="Total events" value={events.length}/></Card>
        <Card><StatBox label="Urgent" value={events.filter(e=>e.rag==="red").length} rag="red"/></Card>
        <Card><StatBox label="Attention" value={events.filter(e=>e.rag==="amber").length} rag="amber"/></Card>
        <Card><StatBox label="Complete" value={events.filter(e=>e.rag==="green").length} rag="green"/></Card>
      </Grid>
      <div style={{fontWeight:700,fontSize:14,margin:"16px 0 10px"}}>Areas</div>
      <Grid cols={2} gap={10}>
        {areas.map(a=>(
          <Card key={a.id} onClick={()=>setView({page:"a_area",propId,areaId:a.id})}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <span style={{fontSize:22}}>{a.icon}</span><RagBadge rag={a.rag}/>
            </div>
            <div style={{fontWeight:600,fontSize:14,marginTop:8}}>{a.name}</div>
            <div style={{fontSize:11,color:C.mid,marginTop:4}}>
              {events.filter(e=>e.area_id===a.id).length} events logged
            </div>
          </Card>
        ))}
      </Grid>
    </div>
  );
}

// ── ADMIN AREA ─────────────────────────────────────────────────────────────
function AdminArea({propId,areaId,setView}) {
  const [prop,setProp]=useState(null);
  const [area,setArea]=useState(null);
  const [rooms,setRooms]=useState([]);
  const [events,setEvents]=useState([]);
  const [tasks,setTasks]=useState([]);
  const [loading,setLoading]=useState(true);

  useEffect(()=>{
    Promise.all([db.getProperties([propId]),db.getAreas(propId),db.getRooms(propId,areaId),
      db.getEvents({propId,areaId}),db.getTasksForArea(propId,areaId)]).then(([ps,areas,r,e,t])=>{
      setProp(ps[0]);setArea(areas.find(a=>a.id===areaId));
      setRooms(r);setEvents(e);setTasks(t);setLoading(false);
    });
  },[propId,areaId]);

  if(loading) return <Spinner/>;
  if(!prop||!area) return null;
  return (
    <div>
      <SectionHead title={area.icon+" "+area.name} sub={prop.name} action={<RagBadge rag={area.rag}/>} back={()=>setView({page:"a_prop",propId})}/>
      {rooms.length>0&&(
        <><div style={{fontWeight:700,fontSize:14,marginBottom:10}}>Rooms</div>
        <Grid cols={3} gap={8}>
          {rooms.map(r=>(
            <Card key={r.id} onClick={()=>setView({page:"a_room",propId,areaId,roomId:r.id})} style={{padding:12}}>
              <div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}>
                <span style={{fontWeight:700,fontSize:13}}>{r.name}</span><RagDot rag={r.rag} size={10}/>
              </div>
              <div style={{fontSize:11,color:C.mid}}>{r.sub_name}</div>
            </Card>
          ))}
        </Grid><div style={{height:16}}/></>
      )}
      <div style={{fontWeight:700,fontSize:14,marginBottom:10}}>Assigned tasks ({tasks.length})</div>
      {tasks.map(t=>(
        <div key={t.id} style={{display:"flex",alignItems:"center",gap:8,padding:"8px 0",borderBottom:"1px solid "+C.line,flexWrap:"wrap"}}>
          <span style={{fontSize:11,fontWeight:700,color:C.teal,minWidth:48}}>{t.ref}</span>
          <span style={{flex:1,fontSize:13}}>{t.name}</span>
          <TypeBadge type={t.type}/>
          <span style={{fontSize:11,color:C.mid}}>{t.frequency}</span>
          {t.charge_rate>0&&<span style={{fontSize:11,fontWeight:600,color:C.green}}>€{t.charge_rate}</span>}
          <span style={{fontSize:11,color:C.mid}}>{t.est_minutes}min</span>
        </div>
      ))}
      <div style={{height:16}}/>
      <Card>
        <div style={{fontWeight:700,fontSize:14,marginBottom:12}}>Events — audit trail</div>
        {events.length?events.map(e=>(
          <div key={e.id} style={{padding:"9px 0",borderBottom:"1px solid "+C.line}}>
            <div style={{display:"flex",gap:8,marginBottom:4,alignItems:"center",flexWrap:"wrap"}}>
              <RagBadge rag={e.rag}/><TypeBadge type={e.tasks?.type}/>
              <span style={{fontSize:11,fontWeight:700,color:C.teal}}>{e.tasks?.ref}</span>
              <span style={{marginLeft:"auto",fontSize:11,color:C.mid}}>{e.completed_at?.slice(0,10)}</span>
            </div>
            <div style={{fontSize:13,marginBottom:4}}>{e.title}</div>
            {e.notes&&<div style={{fontSize:12,color:C.mid,marginBottom:4}}>{e.notes}</div>}
            {e.photo_urls&&e.photo_urls.length>0&&(
              <div style={{display:"flex",gap:6,marginTop:6,flexWrap:"wrap"}}>
                {e.photo_urls.map((url,i)=><img key={i} src={url} style={{width:60,height:60,objectFit:"cover",borderRadius:6,border:"1px solid "+C.line}}/>)}
              </div>
            )}
            <div style={{marginTop:6,display:"flex",gap:8}}>
              <StatusBadge status={e.quote_status}/>
              {e.charge_amount>0&&<span style={{fontSize:11,fontWeight:600,color:C.green}}>€{e.charge_amount}</span>}
            </div>
          </div>
        )):<div style={{fontSize:13,color:C.mid}}>No events yet — events are created during tech visits.</div>}
      </Card>
    </div>
  );
}

// ── ADMIN ROOM ─────────────────────────────────────────────────────────────
function AdminRoom({propId,areaId,roomId,setView}) {
  const [prop,setProp]=useState(null);
  const [area,setArea]=useState(null);
  const [room,setRoom]=useState(null);
  const [events,setEvents]=useState([]);
  const [loading,setLoading]=useState(true);

  useEffect(()=>{
    Promise.all([db.getProperties([propId]),db.getAreas(propId),db.getRooms(propId,areaId),
      db.getEvents({propId,roomId})]).then(([ps,areas,rooms,e])=>{

// ── ADMIN CALENDAR ─────────────────────────────────────────────────────────
function AdminCal({setView}) {
  const [month,setMonth]=useState(7);
  const [schedule,setSchedule]=useState([]);
  const [users,setUsers]=useState([]);
  const [months,setMonths]=useState([]);
  const [loading,setLoading]=useState(true);
  const year=2026;
  const monthNames=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

  useEffect(()=>{
    Promise.all([db.getSchedule(),db.getUsers()]).then(([s,u])=>{
      setSchedule(s);setUsers(u.filter(u=>u.role==="tech"));setLoading(false);
    });
  },[]);

  const firstDay=new Date(year,month,1).getDay();
  const daysInMonth=new Date(year,month+1,0).getDate();
  const cells=Array.from({length:firstDay+daysInMonth},(_,i)=>i<firstDay?null:i-firstDay+1);
  const getV=d=>{
    if(!d) return [];
    const ds=year+"-"+String(month+1).padStart(2,"0")+"-"+String(d).padStart(2,"0");
    return schedule.filter(s=>s.due_date===ds);
  };

  if(loading) return <Spinner/>;
  return (
    <div>
      <SectionHead title="Schedule calendar" sub="12-month visit schedule"/>
      <Card style={{marginBottom:16}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:16}}>
          <Btn variant="ghost" small onClick={()=>setMonth(m=>Math.max(0,m-1))}>← Prev</Btn>
          <div style={{fontWeight:700,fontSize:15}}>{monthNames[month]} {year}</div>
          <Btn variant="ghost" small onClick={()=>setMonth(m=>Math.min(11,m+1))}>Next →</Btn>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:2,marginBottom:6}}>
          {["S","M","T","W","T","F","S"].map((d,i)=><div key={i} style={{textAlign:"center",fontSize:11,fontWeight:700,color:C.mid,padding:"4px 0"}}>{d}</div>)}
        </div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:3}}>
          {cells.map((day,i)=>{
            const vs=getV(day);
            return <div key={i} style={{minHeight:52,padding:3,borderRadius:5,background:vs.length?C.tealL:"transparent",border:"1px solid "+(vs.length?C.teal:C.line)}}>
              {day&&<><div style={{fontSize:11,color:vs.length?C.teal:C.slate,fontWeight:vs.length?700:400}}>{day}</div>
              {vs.slice(0,2).map((v,i)=><div key={i} style={{fontSize:8,background:C.teal,color:C.white,borderRadius:2,padding:"1px 3px",marginTop:1,lineHeight:1.4,overflow:"hidden",whiteSpace:"nowrap"}}>
                {v.tasks?.ref}
              </div>)}
              {vs.length>2&&<div style={{fontSize:8,color:C.teal}}>+{vs.length-2}</div>}</>}
            </div>;
          })}
        </div>
      </Card>
      <Card>
        <div style={{fontWeight:700,fontSize:14,marginBottom:12}}>
          {monthNames[month]} schedule — {schedule.filter(s=>s.due_date?.startsWith(year+"-"+String(month+1).padStart(2,"0"))).length} tasks
        </div>
        {schedule.filter(s=>s.due_date?.startsWith(year+"-"+String(month+1).padStart(2,"0"))).map(s=>(
          <div key={s.id} style={{display:"flex",alignItems:"center",gap:8,padding:"8px 0",borderBottom:"1px solid "+C.line,flexWrap:"wrap"}}>
            <div style={{minWidth:80,fontSize:12,fontWeight:600,color:C.teal}}>{s.due_date}</div>
            <div style={{flex:1}}>
              <div style={{fontSize:13,fontWeight:600}}>{s.tasks?.ref} — {s.tasks?.name}</div>
              <div style={{fontSize:11,color:C.mid}}>{s.areas?.icon} {s.areas?.name} · {s.tasks?.est_minutes}min</div>
            </div>
            <TypeBadge type={s.tasks?.type}/>

          </div>
        ))}
      </Card>
    </div>
  );
}

function TechVisit({date,tasks,user,setView}) {
  const [taskStates,setTaskStates]=useState({});
  const [submitting,setSubmitting]=useState(false);
  const [submitted,setSubmitted]=useState(false);
  const [current,setCurrent]=useState(0);

  const set=(id,field,val)=>setTaskStates(p=>({...p,[id]:{...(p[id]||{}),[field]:val}}));
  const done=Object.keys(taskStates).filter(id=>taskStates[id]?.rag).length;
  const task=tasks[current];
  const ts=taskStates[task?.id]||{};

  const submitAll=async()=>{
    setSubmitting(true);
    try {
      for(const s of tasks) {
        const state=taskStates[s.id]||{};
        const rag=state.rag||"green";
        // Upload photos
        let photoUrls=[];
        if(state.photoFile) {
          const path=s.prop_id+"/"+s.area_id+"/"+(s.room_id||"area")+"/"+s.task_id+"_"+Date.now()+".jpg";
          const url=await db.uploadPhoto(state.photoFile,path);
          if(url) photoUrls=[url];
        }
        // Create event
        await db.createEvent({
          schedule_id:s.id,
          task_id:s.task_id,
          prop_id:s.prop_id,
          area_id:s.area_id,
          room_id:s.room_id||null,
          tech_id:user.id,
          rag,
          title:s.tasks?.name,
          notes:state.note||"",
          photo_urls:photoUrls,
          chargeable:true,
          charge_amount:s.tasks?.charge_rate||0,
          quote_status:"none",
          month_label:s.month_label,
          visible_owner:true,
        });
        await db.completeScheduleEntry(s.id);
      }
      setSubmitted(true);
    } catch(e) { alert("Error submitting: "+e.message); }
    setSubmitting(false);
  };

  if(submitted) return (
    <Card style={{textAlign:"center",padding:48}}>
      <div style={{fontSize:48,marginBottom:12}}>✅</div>
      <div style={{fontSize:22,fontWeight:700,color:C.green,marginBottom:8}}>Visit complete</div>

  );

  if(!task) return null;
  return (
    <div>
      <SectionHead title={date} sub={current+1+" of "+tasks.length+" · "+done+" complete"} back={()=>setView({page:"t_dash"})}/>

      {/* Progress bar */}
      <div style={{height:4,background:C.line,borderRadius:2,marginBottom:20}}>
        <div style={{height:"100%",background:C.teal,borderRadius:2,width:((current+1)/tasks.length*100)+"%",transition:"width .3s"}}/>
      </div>

      {/* Current task */}
      <Card style={{marginBottom:14,borderLeft:"4px solid "+(ts.rag?RAG[ts.rag].border:C.teal)}}>
        <div style={{display:"flex",justifyContent:"space-between",marginBottom:8}}>

        </div>
        <div style={{fontSize:16,fontWeight:700,marginBottom:6}}>{task.tasks?.name}</div>
        <div style={{fontSize:11,color:C.mid}}>{task.areas?.icon} {task.areas?.name}{task.rooms?" · "+task.rooms.name:""}</div>

        {task.tasks?.description&&(
          <div style={{marginTop:10,padding:"10px 12px",background:C.bg,borderRadius:8,fontSize:13,color:C.slate,lineHeight:1.6}}>
            {task.tasks.description}
          </div>
        )}

        {task.tasks?.bom&&(
          <div style={{marginTop:10,padding:"10px 12px",background:C.amberL,borderRadius:8}}>
            <div style={{fontSize:11,fontWeight:700,color:C.amber,marginBottom:4}}>📦 BRING WITH YOU</div>
            <div style={{fontSize:13,color:C.amber}}>{task.tasks.bom}</div>
          </div>
        )}

        <div style={{marginTop:14}}>
          <div style={{fontSize:12,fontWeight:600,color:C.slate,marginBottom:8}}>Task outcome:</div>
          <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
            {["green","amber","red"].map(r=>(
              <button key={r} onClick={()=>set(task.id,"rag",r)} style={{padding:"8px 20px",borderRadius:20,border:"2px solid "+(ts.rag===r?RAG[r].border:C.line),background:ts.rag===r?RAG[r].bg:C.white,color:ts.rag===r?RAG[r].text:C.mid,fontSize:13,fontWeight:700,cursor:"pointer"}}>
                {RAG[r].label}
              </button>
            ))}
          </div>
        </div>

        {ts.rag&&ts.rag!=="green"&&(
          <textarea placeholder="Describe the finding…" rows={3} value={ts.note||""} onChange={e=>set(task.id,"note",e.target.value)}
            style={{marginTop:12,width:"100%",padding:"8px 12px",border:"1px solid "+C.line,borderRadius:7,fontSize:13,resize:"vertical",fontFamily:"inherit",outline:"none"}}/>
        )}

        {task.tasks?.photo_req&&(
          <label style={{marginTop:12,display:"inline-flex",alignItems:"center",gap:8,padding:"8px 14px",borderRadius:8,border:"1.5px solid "+(ts.photo?C.teal:C.line),background:ts.photo?C.tealL:C.white,color:ts.photo?C.teal:C.mid,fontSize:13,cursor:"pointer"}}>
            {ts.photo?"📷 Photo captured ✓":"📷 Take photo (required)"}
            <input type="file" accept="image/*" capture="environment" style={{display:"none"}}
              onChange={async e=>{
                const file=e.target.files[0]; if(!file) return;
                set(task.id,"photo",true); set(task.id,"photoFile",file);
                set(task.id,"photoPreview",URL.createObjectURL(file));
              }}/>

        {ts.photoPreview&&<img src={ts.photoPreview} style={{marginTop:8,width:"100%",maxHeight:180,objectFit:"cover",borderRadius:8,border:"1px solid "+C.line}}/>}
      </Card>

      {/* Navigation */}
      <div style={{display:"flex",gap:10,justifyContent:"space-between"}}>
        <Btn variant="ghost" onClick={()=>setCurrent(c=>Math.max(0,c-1))} disabled={current===0}>← Previous</Btn>
        {current<tasks.length-1?(
          <Btn onClick={()=>setCurrent(c=>c+1)} disabled={!ts.rag}>Next task →</Btn>
        ):(
          <Btn onClick={submitAll} disabled={submitting||done===0} variant="primary">
            {submitting?"Submitting…":"Submit all "+done+" tasks ✓"}
          </Btn>
        )}
      </div>

      {/* Task list overview */}
      <div style={{marginTop:20}}>
        <div style={{fontSize:12,fontWeight:600,color:C.mid,marginBottom:8}}>All tasks this visit</div>
        <div style={{display:"flex",gap:4,flexWrap:"wrap"}}>
          {tasks.map((t,i)=>{

            return <button key={t.id} onClick={()=>setCurrent(i)} style={{padding:"4px 8px",borderRadius:6,border:"1.5px solid "+(i===current?C.teal:s.rag?RAG[s.rag].border:C.line),background:i===current?C.tealL:s.rag?RAG[s.rag].bg:C.white,color:i===current?C.teal:s.rag?RAG[s.rag].text:C.mid,fontSize:11,fontWeight:600,cursor:"pointer"}}>

        </div>
      </div>
    </div>
  );
}

const NAVS={

  tech: [{id:"t_dash",l:"My visits",i:"📋"}],
  owner:[{id:"o_dash",l:"Properties",i:"🏨"},{id:"o_pend",l:"Pending",i:"⚑"},{id:"o_rep",l:"Reports",i:"📊"}],
};
const PCOL={admin:C.teal,tech:"#6366F1",owner:C.amber};

// ── APP ROOT ───────────────────────────────────────────────────────────────
function App() {
  const [user,setUser]=useState(null);
  const [view,setView]=useState({page:"a_dash"});
  const [menu,setMenu]=useState(false);

  const login=u=>{setUser(u);const d={admin:"a_dash",tech:"t_dash",owner:"o_dash"};setView({page:d[u.role]});};
  const logout=()=>{setUser(null);setView({page:"a_dash"});};

  if(!user) return <Login onLogin={login}/>;

  const nav=NAVS[user.role]||[];
  const pc=PCOL[user.role];

  const isActive=nid=>{
    if(nid==="a_dash"&&(view.page.startsWith("a_prop")||view.page.startsWith("a_area")||view.page.startsWith("a_room"))) return true;
    if(nid==="o_dash"&&(view.page.startsWith("o_prop")||view.page.startsWith("o_area")||view.page.startsWith("o_room"))) return true;
    if(nid==="t_dash"&&view.page.startsWith("t_")) return true;
    return view.page===nid;
  };

  const content=()=>{
    switch(view.page){
      case "a_dash":   return <AdminDash setView={setView}/>;
      case "a_prop":   return <AdminProp propId={view.propId} setView={setView}/>;
      case "a_area":   return <AdminArea propId={view.propId} areaId={view.areaId} setView={setView}/>;
      case "a_room":   return <AdminRoom propId={view.propId} areaId={view.areaId} roomId={view.roomId} setView={setView}/>;
      case "a_cal":    return <AdminCal setView={setView}/>;
      case "a_events": return <AdminEvents/>;
      case "a_manage": return <AdminManage/>;
      case "t_dash":   return <TechDash user={user} setView={setView}/>;
      case "t_visit":  return <TechVisit date={view.date} tasks={view.tasks} user={user} setView={setView}/>;
      case "o_dash":   return <OwnerDash user={user} setView={setView}/>;
      case "o_prop":   return <OwnerProp user={user} propId={view.propId} setView={setView}/>;
      case "o_area":   return <OwnerArea user={user} propId={view.propId} areaId={view.areaId} setView={setView}/>;
      case "o_room":   return <OwnerRoom user={user} propId={view.propId} areaId={view.areaId} roomId={view.roomId} setView={setView}/>;
      case "o_pend":   return <OwnerPending user={user}/>;
      case "o_rep":    return <OwnerReports user={user}/>;
      default: return null;
    }
  };

  return (
    <div style={{fontFamily:"-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif",background:C.bg,minHeight:"100vh",display:"flex",flexDirection:"column"}}>
      <div style={{background:C.nav,padding:"0 16px",display:"flex",alignItems:"center",height:50,position:"sticky",top:0,zIndex:100}}>
        <button onClick={()=>setMenu(!menu)} style={{background:"none",border:"none",color:C.white,fontSize:20,cursor:"pointer",marginRight:12,padding:"0 4px"}}>☰</button>
        <div style={{color:C.white,fontWeight:800,fontSize:15,letterSpacing:-0.5,flex:1}}>PMS Malta</div>
        <div style={{padding:"3px 10px",borderRadius:20,background:pc,color:C.white,fontSize:11,fontWeight:600,marginRight:12}}>
          {user.role.charAt(0).toUpperCase()+user.role.slice(1)}
        </div>
        <button onClick={logout} style={{background:"rgba(255,255,255,0.1)",border:"none",color:"rgba(255,255,255,0.8)",padding:"4px 10px",borderRadius:6,fontSize:11,cursor:"pointer"}}>Sign out</button>
      </div>

      {menu&&<div style={{position:"fixed",top:50,left:0,bottom:0,right:0,zIndex:200,display:"flex"}}>
        <div style={{width:220,background:C.nav,padding:"20px 12px",overflowY:"auto"}}>
          <div style={{fontSize:10,fontWeight:700,color:"rgba(255,255,255,0.3)",marginBottom:10,paddingLeft:8,textTransform:"uppercase",letterSpacing:1}}>{user.role} portal</div>
          {nav.map(n=>{
            const active=isActive(n.id);
            return <button key={n.id} onClick={()=>{setView({page:n.id});setMenu(false);}} style={{display:"flex",alignItems:"center",gap:10,width:"100%",padding:"10px 8px",borderRadius:7,border:"none",cursor:"pointer",marginBottom:4,background:active?"rgba(255,255,255,0.12)":"transparent",color:active?C.white:"rgba(255,255,255,0.55)",fontSize:14,fontWeight:active?600:400,textAlign:"left"}}>
              <span style={{fontSize:16}}>{n.i}</span>{n.l}
            </button>;
          })}
          <div style={{marginTop:20,borderTop:"1px solid rgba(255,255,255,0.1)",paddingTop:16}}>
            <div style={{fontSize:11,color:"rgba(255,255,255,0.4)",padding:"6px 8px"}}>{user.name}</div>
            <div style={{fontSize:11,color:"rgba(255,255,255,0.3)",padding:"0 8px 6px"}}>{user.email}</div>
          </div>
        </div>
        <div style={{flex:1,background:"rgba(0,0,0,0.4)"}} onClick={()=>setMenu(false)}/>
      </div>}

      <div style={{flex:1,padding:16,overflowY:"auto"}}>{content()}</div>

      <div style={{background:C.nav,display:"flex",borderTop:"1px solid rgba(255,255,255,0.1)",position:"sticky",bottom:0}}>
        {nav.map(n=>{
          const active=isActive(n.id);
          return <button key={n.id} onClick={()=>setView({page:n.id})} style={{flex:1,padding:"10px 0",background:"transparent",border:"none",cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",gap:3}}>
            <span style={{fontSize:18}}>{n.i}</span>
            <span style={{fontSize:9,color:active?pc:"rgba(255,255,255,0.4)",fontWeight:active?700:400}}>{n.l}</span>
          </button>;
        })}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
