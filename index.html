<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PMS Malta">
<title>PMS Malta</title>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#F7F9FB;min-height:100vh;}
input,textarea,button,select{font-family:inherit;}
button:active{opacity:.85;}
</style>
</head>
<body>
<div id="root"></div>
<script>
const SUPA=supabase.createClient("https://ingmfhuyyhlsdptuebpa.supabase.co","sb_publishable_TKSTjRCws76fU9mBJtiCLw_-PdqKM0l");
</script>
<script type="text/babel">
const {useState,useEffect}=React;
const C={nav:"#0F1923",teal:"#1A7A6E",tealL:"#E6F4F2",amber:"#D4920A",amberL:"#FEF7E6",red:"#C0392B",redL:"#FDECEA",green:"#1A7A4A",greenL:"#E6F5ED",mid:"#64748B",line:"#E2E8F0",bg:"#F7F9FB",white:"#FFFFFF",text:"#0F1923",slate:"#2C3E50"};
const RAG={green:{bg:C.greenL,text:C.green,border:C.green,dot:C.green,label:"Good"},amber:{bg:C.amberL,text:C.amber,border:C.amber,dot:C.amber,label:"Attention"},red:{bg:C.redL,text:C.red,border:C.red,dot:C.red,label:"Urgent"}};

// ── DB ─────────────────────────────────────────────────────────────────────
const db={
  async login(e,p){const{data,error}=await SUPA.from("users").select("*").eq("email",e).eq("password",p).single();return{data,error};},
  async getProperties(ids){let q=SUPA.from("properties").select("*");if(ids&&ids.length)q=q.in("id",ids);const{data}=await q;return data||[];},
  async getAreas(propId){const{data}=await SUPA.from("areas").select("*").eq("prop_id",propId).order("sort_order");return data||[];},
  async getRooms(propId,areaId){const{data}=await SUPA.from("rooms").select("*").eq("prop_id",propId).eq("area_id",areaId).order("name");return data||[];},
  async getUsers(){const{data}=await SUPA.from("users").select("*");return data||[];},
  async getTasksForArea(propId,areaId){const{data}=await SUPA.from("tasks").select("*").eq("prop_id",propId).eq("area_id",areaId).is("room_id",null).eq("active",true);return data||[];},
  async getAllTasks(propId){const{data}=await SUPA.from("tasks").select("*").eq("prop_id",propId).eq("active",true);return data||[];},
  async getEvents(f={}){
    let q=SUPA.from("events").select("*,tasks(ref,name,type,charge_rate,description),areas(name,icon),rooms(name,sub_name)").order("completed_at",{ascending:false});
    if(f.propId) q=q.eq("prop_id",f.propId);
    if(f.areaId) q=q.eq("area_id",f.areaId);
    if(f.roomId) q=q.eq("room_id",f.roomId);
    if(f.propIds&&f.propIds.length) q=q.in("prop_id",f.propIds);
    if(f.month) q=q.eq("month_label",f.month);
    const{data}=await q;return data||[];
  },
  async createEvent(d){const{error}=await SUPA.from("events").insert({id:"ev"+Date.now()+Math.floor(Math.random()*9999),...d});if(error)throw error;},
  async updateEvent(id,u){await SUPA.from("events").update(u).eq("id",id);},
  // Schedule with approval
  async getScheduleMonths(propId){
    const{data}=await SUPA.from("schedule").select("month_label,approval_status").eq("prop_id",propId);
    const map={};(data||[]).forEach(d=>{if(!map[d.month_label])map[d.month_label]=d.approval_status;});
    return map;
  },
  async getScheduleForMonth(propId,month){
    const{data}=await SUPA.from("schedule").select("*,tasks(ref,name,type,est_minutes,bom,description,photo_req,charge_rate,grade),areas(name,icon),rooms(name)").eq("prop_id",propId).eq("month_label",month).order("due_date");
    return data||[];
  },
  async approveMonth(propId,month,userId){
    await SUPA.from("schedule").update({approval_status:"approved",approved_by:userId,approved_at:new Date().toISOString()}).eq("prop_id",propId).eq("month_label",month);
  },
  async getTechSchedule(techId){
    const{data}=await SUPA.from("schedule").select("*,tasks(ref,name,type,est_minutes,bom,description,photo_req,charge_rate,grade),areas(name,icon),rooms(name,sub_name)").eq("tech_id",techId).eq("approval_status","approved").eq("status","scheduled").order("due_date");
    return data||[];
  },
  async completeEntry(id){await SUPA.from("schedule").update({status:"complete"}).eq("id",id);},
  async uploadPhoto(file,path){
    const{error}=await SUPA.storage.from("visit-photos").upload(path,file,{upsert:true});
    if(error){console.error(error);return null;}
    const{data}=SUPA.storage.from("visit-photos").getPublicUrl(path);
    return data.publicUrl;
  },
  async addProperty(name,address,type){const id="p"+Date.now();await SUPA.from("properties").insert({id,name,address,type,rag:"green",room_count:0});return id;},
  async addArea(propId,name,icon,hasRooms){const id="a"+Date.now();await SUPA.from("areas").insert({id,prop_id:propId,name,icon:icon||"📋",has_rooms:hasRooms,rag:"green",sort_order:99});return id;},
  async addRoom(propId,areaId,name,subName){const id="r"+Date.now();await SUPA.from("rooms").insert({id,prop_id:propId,area_id:areaId,name,sub_name:subName,rag:"green"});return id;},
  async addUser(name,role,email,password,propIds){const id="u"+Date.now();const{error}=await SUPA.from("users").insert({id,name,role,email,password,prop_ids:propIds||[]});if(error)throw error;return id;},
  async addTask(d){const id="tk"+Date.now();const{error}=await SUPA.from("tasks").insert({id,...d,active:true});if(error)throw error;return id;},
};

// ── UI ─────────────────────────────────────────────────────────────────────
const RagDot=({rag,size=10})=><span style={{display:"inline-block",width:size,height:size,borderRadius:"50%",background:RAG[rag]?.dot||C.mid,flexShrink:0}}/>;
const RagBadge=({rag})=>rag&&RAG[rag]?<span style={{display:"inline-flex",alignItems:"center",gap:5,padding:"3px 10px",borderRadius:20,background:RAG[rag].bg,color:RAG[rag].text,fontSize:11,fontWeight:600,border:"1px solid "+RAG[rag].border,whiteSpace:"nowrap"}}><RagDot rag={rag} size={7}/>{RAG[rag].label}</span>:null;
const TypeBadge=({type})=>{const m={elec:"Electrical",hydro:"Water",hvac:"HVAC",misc:"General",fire:"Fire",pest:"Pest",pool:"Pool"};return<span style={{padding:"2px 8px",borderRadius:4,background:"#EFF3F8",color:C.slate,fontSize:11}}>{m[type]||type}</span>;};
const Card=({children,style={},onClick})=><div onClick={onClick} style={{background:C.white,border:"1px solid "+C.line,borderRadius:10,padding:16,cursor:onClick?"pointer":"default",...style}}>{children}</div>;
const SectionHead=({title,sub,action,back})=><div style={{marginBottom:20}}>{back&&<button onClick={back} style={{background:"none",border:"none",color:C.teal,fontSize:13,cursor:"pointer",padding:"0 0 8px 0",display:"block"}}>← Back</button>}<div style={{display:"flex",alignItems:"flex-start",justifyContent:"space-between"}}><div><div style={{fontSize:19,fontWeight:700,color:C.text}}>{title}</div>{sub&&<div style={{fontSize:12,color:C.mid,marginTop:2}}>{sub}</div>}</div>{action}</div></div>;
const Btn=({children,onClick,variant="primary",small=false,full=false,disabled=false})=>{const s={primary:{background:C.teal,color:C.white,border:"none"},secondary:{background:C.white,color:C.teal,border:"1.5px solid "+C.teal},ghost:{background:"transparent",color:C.mid,border:"1px solid "+C.line},amber:{background:C.amberL,color:C.amber,border:"1px solid "+C.amber},green:{background:C.greenL,color:C.green,border:"1px solid "+C.green}};return<button onClick={onClick} disabled={disabled} style={{...s[variant],padding:small?"5px 12px":"8px 18px",borderRadius:7,fontSize:small?12:13,fontWeight:600,cursor:disabled?"not-allowed":"pointer",opacity:disabled?.5:1,display:"inline-flex",alignItems:"center",gap:6,width:full?"100%":"auto",justifyContent:full?"center":"flex-start"}}>{children}</button>;};
const StatBox=({label,value,rag})=><div style={{textAlign:"center",padding:"12px 0"}}><div style={{fontSize:28,fontWeight:700,color:rag?RAG[rag].text:C.teal}}>{value??0}</div><div style={{fontSize:11,color:C.mid,marginTop:3}}>{label}</div></div>;
const G=({cols=2,children,gap=10})=><div style={{display:"grid",gridTemplateColumns:"repeat("+cols+",1fr)",gap}}>{children}</div>;
const Spin=()=><div style={{textAlign:"center",padding:40,color:C.mid}}>Loading…</div>;
const Inp=({label,value,onChange,placeholder,type="text",rows})=><div style={{marginBottom:12}}>{label&&<label style={{fontSize:11,fontWeight:600,color:C.slate,display:"block",marginBottom:4}}>{label}</label>}{rows?<textarea value={value} onChange={e=>onChange(e.target.value)} placeholder={placeholder} rows={rows} style={{width:"100%",padding:"8px 12px",borderRadius:7,border:"1px solid "+C.line,fontSize:13,outline:"none",resize:"vertical",fontFamily:"inherit"}}/>:<input value={value} onChange={e=>onChange(e.target.value)} placeholder={placeholder} type={type} style={{width:"100%",padding:"8px 12px",borderRadius:7,border:"1px solid "+C.line,fontSize:13,outline:"none"}}/>}</div>;
const Sel=({label,value,onChange,options})=><div style={{marginBottom:12}}>{label&&<label style={{fontSize:11,fontWeight:600,color:C.slate,display:"block",marginBottom:4}}>{label}</label>}<select value={value} onChange={e=>onChange(e.target.value)} style={{width:"100%",padding:"8px 12px",borderRadius:7,border:"1px solid "+C.line,fontSize:13,outline:"none",background:"white"}}>{options.map(o=><option key={o.v} value={o.v}>{o.l}</option>)}</select></div>;

// Derive area RAG from events
const areaRag=(events,areaId)=>{
  const ae=events.filter(e=>e.area_id===areaId);
  if(ae.some(e=>e.rag==="red")) return "red";
  if(ae.some(e=>e.rag==="amber")) return "amber";
  if(ae.length) return "green";
  return "green";
};
const roomRag=(events,roomId)=>{
  const re=events.filter(e=>e.room_id===roomId);
  if(re.some(e=>e.rag==="red")) return "red";
  if(re.some(e=>e.rag==="amber")) return "amber";
  if(re.length) return "green";
  return "green";
};

// ── LOGIN ──────────────────────────────────────────────────────────────────
function Login({onLogin}){
  const[email,setEmail]=useState("");const[pass,setPass]=useState("");const[err,setErr]=useState("");const[loading,setLoading]=useState(false);
  const attempt=async()=>{if(!email||!pass){setErr("Enter email and password.");return;}setErr("");setLoading(true);const{data}=await db.login(email,pass);if(data)onLogin(data);else{setErr("Incorrect email or password.");setLoading(false);}};
  return<div style={{minHeight:"100vh",background:C.nav,display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
    <div style={{background:C.white,borderRadius:16,padding:36,width:"100%",maxWidth:380}}>
      <div style={{textAlign:"center",marginBottom:28}}><div style={{fontSize:26,fontWeight:800,color:C.teal,letterSpacing:-1}}>PMS Malta</div><div style={{fontSize:12,color:C.mid,marginTop:4}}>Preventive Maintenance Services</div></div>
      <Inp label="Email" value={email} onChange={setEmail} placeholder="you@example.com" type="email"/>
      <Inp label="Password" value={pass} onChange={setPass} placeholder="••••••••" type="password"/>
      {err&&<div style={{marginBottom:12,padding:"8px 12px",background:C.redL,color:C.red,borderRadius:6,fontSize:13}}>{err}</div>}
      <Btn onClick={attempt} full disabled={loading}>{loading?"Signing in…":"Sign in"}</Btn>
    </div>
  </div>;
}

// ── ADMIN DASHBOARD ────────────────────────────────────────────────────────
function AdminDash({setView}){
  const[props,setProps]=useState([]);const[events,setEvents]=useState([]);const[loading,setLoading]=useState(true);
  useEffect(()=>{Promise.all([db.getProperties(),db.getEvents()]).then(([p,e])=>{setProps(p);setEvents(e);setLoading(false);});},[]);
  if(loading)return<Spin/>;
  const reds=events.filter(e=>e.rag==="red").length,ambers=events.filter(e=>e.rag==="amber").length;
  return<div>
    <SectionHead title="Dashboard" sub="All properties · live status"/>
    <G cols={4} gap={10}><Card><StatBox label="Properties" value={props.length}/></Card><Card><StatBox label="Total events" value={events.length}/></Card><Card><StatBox label="Urgent" value={reds} rag="red"/></Card><Card><StatBox label="Attention" value={ambers} rag="amber"/></Card></G>
    <div style={{height:14}}/>
    {props.map(p=>{
      const pe=events.filter(e=>e.prop_id===p.id);
      const pr=pe.some(e=>e.rag==="red")?"red":pe.some(e=>e.rag==="amber")?"amber":"green";
      return<Card key={p.id} onClick={()=>setView({page:"a_prop",propId:p.id})} style={{marginBottom:12}}>
        <div style={{display:"flex",justifyContent:"space-between",marginBottom:8}}><div><div style={{fontWeight:700,fontSize:15}}>{p.name}</div><div style={{fontSize:12,color:C.mid}}>{p.type} · {p.room_count} rooms</div></div><RagBadge rag={pr}/></div>
        <div style={{display:"flex",gap:14,fontSize:12}}><span style={{color:C.red}}>✕ {pe.filter(e=>e.rag==="red").length} urgent</span><span style={{color:C.amber}}>⚠ {pe.filter(e=>e.rag==="amber").length} amber</span><span style={{color:C.green}}>✓ {pe.filter(e=>e.rag==="green").length} good</span></div>
      </Card>;
    })}
    <Card><div style={{fontWeight:700,fontSize:14,marginBottom:12}}>Urgent events requiring action</div>
    {events.filter(e=>e.rag==="red").map(f=><div key={f.id} style={{display:"flex",alignItems:"center",gap:8,padding:"8px 0",borderBottom:"1px solid "+C.line,flexWrap:"wrap"}}><RagBadge rag={f.rag}/><TypeBadge type={f.tasks?.type}/><span style={{flex:1,fontSize:13}}>{f.title}</span><span style={{fontSize:11,color:C.mid}}>{f.areas?.icon} {f.areas?.name}</span></div>)}
    {events.filter(e=>e.rag==="red").length===0&&<div style={{fontSize:13,color:C.mid}}>No urgent events.</div>}</Card>
  </div>;
}

// ── ADMIN PROPERTY ─────────────────────────────────────────────────────────
function AdminProp({propId,setView}){
  const[prop,setProp]=useState(null);const[areas,setAreas]=useState([]);const[events,setEvents]=useState([]);const[loading,setLoading]=useState(true);
  useEffect(()=>{Promise.all([db.getProperties([propId]),db.getAreas(propId),db.getEvents({propId})]).then(([ps,a,e])=>{setProp(ps[0]);setAreas(a);setEvents(e);setLoading(false);});},[propId]);
  if(loading)return<Spin/>;if(!prop)return null;
  return<div>
    <SectionHead title={prop.name} sub={prop.address} action={<RagBadge rag={events.some(e=>e.rag==="red")?"red":events.some(e=>e.rag==="amber")?"amber":"green"}/>} back={()=>setView({page:"a_dash"})}/>
    <G cols={4} gap={10}><Card><StatBox label="Events" value={events.length}/></Card><Card><StatBox label="Urgent" value={events.filter(e=>e.rag==="red").length} rag="red"/></Card><Card><StatBox label="Attention" value={events.filter(e=>e.rag==="amber").length} rag="amber"/></Card><Card><StatBox label="Complete" value={events.filter(e=>e.rag==="green").length} rag="green"/></Card></G>
    <div style={{fontWeight:700,fontSize:14,margin:"16px 0 10px"}}>Areas — tap to see events and tasks</div>
    <G cols={2} gap={10}>
      {areas.map(a=>{const ar=areaRag(events,a.id);return<Card key={a.id} onClick={()=>setView({page:"a_area",propId,areaId:a.id})}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}><span style={{fontSize:22}}>{a.icon}</span><RagBadge rag={ar}/></div>
        <div style={{fontWeight:600,fontSize:14,marginTop:8}}>{a.name}</div>
        <div style={{fontSize:11,color:C.mid,marginTop:4,display:"flex",gap:10}}><span style={{color:C.red}}>✕ {events.filter(e=>e.area_id===a.id&&e.rag==="red").length}</span><span style={{color:C.amber}}>⚠ {events.filter(e=>e.area_id===a.id&&e.rag==="amber").length}</span><span style={{color:C.green}}>✓ {events.filter(e=>e.area_id===a.id&&e.rag==="green").length}</span></div>
      </Card>;})}
    </G>
  </div>;
}

// ── ADMIN AREA ─────────────────────────────────────────────────────────────
function AdminArea({propId,areaId,setView}){
  const[prop,setProp]=useState(null);const[area,setArea]=useState(null);const[rooms,setRooms]=useState([]);const[events,setEvents]=useState([]);const[tasks,setTasks]=useState([]);const[tab,setTab]=useState("events");const[loading,setLoading]=useState(true);
  useEffect(()=>{Promise.all([db.getProperties([propId]),db.getAreas(propId),db.getRooms(propId,areaId),db.getEvents({propId,areaId}),db.getTasksForArea(propId,areaId)]).then(([ps,areas,r,e,t])=>{setProp(ps[0]);setArea(areas.find(a=>a.id===areaId));setRooms(r);setEvents(e);setTasks(t);setLoading(false);});},[propId,areaId]);
  if(loading)return<Spin/>;if(!prop||!area)return null;
  const ar=areaRag(events,areaId);
  // Group area-level events (no room)
  const areaEvents=events.filter(e=>!e.room_id);
  return<div>
    <SectionHead title={area.icon+" "+area.name} sub={prop.name} action={<RagBadge rag={ar}/>} back={()=>setView({page:"a_prop",propId})}/>
    {rooms.length>0&&<><div style={{fontWeight:700,fontSize:14,marginBottom:10}}>Rooms</div>
    <G cols={3} gap={8}>
      {rooms.map(r=>{const rr=roomRag(events,r.id);return<Card key={r.id} onClick={()=>setView({page:"a_room",propId,areaId,roomId:r.id})} style={{padding:12}}>
        <div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}><span style={{fontWeight:700,fontSize:13}}>{r.name}</span><RagDot rag={rr} size={10}/></div>
        <div style={{fontSize:11,color:C.mid}}>{r.sub_name}</div>
        <div style={{fontSize:10,color:C.mid,marginTop:4}}>{events.filter(e=>e.room_id===r.id).length} events</div>
      </Card>;})}
    </G><div style={{height:16}}/></>}
    <div style={{display:"flex",gap:6,marginBottom:16}}>
      {[["events","Events ("+areaEvents.length+")"],["tasks","Assigned tasks ("+tasks.length+")"]].map(([id,l])=>(
        <button key={id} onClick={()=>setTab(id)} style={{padding:"6px 16px",borderRadius:20,border:"1.5px solid "+(tab===id?C.teal:C.line),background:tab===id?C.teal:C.white,color:tab===id?C.white:C.mid,fontSize:12,fontWeight:600,cursor:"pointer"}}>{l}</button>
      ))}
    </div>
    {tab==="events"&&<Card>
      {areaEvents.length?areaEvents.map(e=><EventCard key={e.id} event={e} showActions={false}/>):<div style={{fontSize:13,color:C.mid}}>No area-level events. Check individual rooms above.</div>}
    </Card>}
    {tab==="tasks"&&<Card>
      {tasks.map(t=><div key={t.id} style={{display:"flex",alignItems:"center",gap:8,padding:"9px 0",borderBottom:"1px solid "+C.line,flexWrap:"wrap"}}>
        <span style={{fontSize:11,fontWeight:700,color:C.teal,minWidth:50}}>{t.ref}</span>
        <div style={{flex:1}}><div style={{fontSize:13,fontWeight:600}}>{t.name}</div>{t.bom&&<div style={{fontSize:11,color:C.amber,marginTop:2}}>📦 {t.bom}</div>}</div>
        <TypeBadge type={t.type}/><span style={{fontSize:11,color:C.mid}}>{t.frequency}</span>
        {t.est_minutes&&<span style={{fontSize:11,color:C.mid}}>{t.est_minutes}min</span>}
        {t.charge_rate>0&&<span style={{fontSize:11,fontWeight:600,color:C.green}}>€{t.charge_rate}</span>}
      </div>)}
      {tasks.length===0&&<div style={{fontSize:13,color:C.mid}}>No tasks assigned to this area yet.</div>}
    </Card>}
  </div>;
}

// ── ADMIN ROOM ─────────────────────────────────────────────────────────────
function AdminRoom({propId,areaId,roomId,setView}){
  const[prop,setProp]=useState(null);const[area,setArea]=useState(null);const[room,setRoom]=useState(null);const[events,setEvents]=useState([]);const[tasks,setTasks]=useState([]);const[tab,setTab]=useState("events");const[loading,setLoading]=useState(true);
  useEffect(()=>{Promise.all([db.getProperties([propId]),db.getAreas(propId),db.getRooms(propId,areaId),db.getEvents({propId,roomId}),db.getTasksForArea(propId,areaId)]).then(([ps,areas,rooms,e,t])=>{setProp(ps[0]);setArea(areas.find(a=>a.id===areaId));setRoom(rooms.find(r=>r.id===roomId));setEvents(e);setTasks(t);setLoading(false);});},[propId,areaId,roomId]);
  if(loading)return<Spin/>;if(!prop||!area||!room)return null;
  const rr=roomRag(events,roomId);
  return<div>
    <SectionHead title={room.name} sub={room.sub_name+" · "+area.name+" · "+prop.name} action={<RagBadge rag={rr}/>} back={()=>setView({page:"a_area",propId,areaId})}/>
    <G cols={3} gap={10}><Card><StatBox label="Events" value={events.length}/></Card><Card><StatBox label="Urgent" value={events.filter(e=>e.rag==="red").length} rag="red"/></Card><Card><StatBox label="Complete" value={events.filter(e=>e.rag==="green").length} rag="green"/></Card></G>
    <div style={{display:"flex",gap:6,margin:"16px 0"}}>
      {[["events","Events"],["tasks","Tasks"]].map(([id,l])=>(
        <button key={id} onClick={()=>setTab(id)} style={{padding:"6px 16px",borderRadius:20,border:"1.5px solid "+(tab===id?C.teal:C.line),background:tab===id?C.teal:C.white,color:tab===id?C.white:C.mid,fontSize:12,fontWeight:600,cursor:"pointer"}}>{l}</button>
      ))}
    </div>
    {tab==="events"&&<Card>{events.length?events.map(e=><EventCard key={e.id} event={e} showActions={false}/>):<div style={{fontSize:13,color:C.mid}}>No events yet for this room.</div>}</Card>}
    {tab==="tasks"&&<Card>{tasks.map(t=><div key={t.id} style={{display:"flex",gap:8,padding:"9px 0",borderBottom:"1px solid "+C.line,flexWrap:"wrap",alignItems:"center"}}><span style={{fontSize:11,fontWeight:700,color:C.teal,minWidth:50}}>{t.ref}</span><div style={{flex:1}}><div style={{fontSize:13}}>{t.name}</div>{t.bom&&<div style={{fontSize:11,color:C.amber,marginTop:2}}>📦 {t.bom}</div>}</div><TypeBadge type={t.type}/></div>)}</Card>}

function TechVisit({date,tasks,user,setView}){
  const[states,setStates]=useState({});const[submitting,setSubmitting]=useState(false);const[submitted,setSubmitted]=useState(false);const[current,setCurrent]=useState(0);
  const set=(id,field,val)=>setStates(p=>({...p,[id]:{...(p[id]||{}),[field]:val}}));
  const done=Object.keys(states).filter(id=>states[id]?.rag).length;
  const task=tasks[current];const ts=states[task?.id]||{};

  const submitAll=async()=>{
    setSubmitting(true);
    try{
      for(const s of tasks){
        const st=states[s.id]||{};const rag=st.rag||"green";
        let photoUrls=[];
        if(st.photoFile){const path=s.prop_id+"/"+s.area_id+"/"+(s.room_id||"area")+"/"+s.task_id+"_"+Date.now()+".jpg";const url=await db.uploadPhoto(st.photoFile,path);if(url)photoUrls=[url];}
        await db.createEvent({schedule_id:s.id,task_id:s.task_id,prop_id:s.prop_id,area_id:s.area_id,room_id:s.room_id||null,tech_id:user.id,rag,title:s.tasks?.name,notes:st.note||"",photo_urls:photoUrls,chargeable:true,charge_amount:s.tasks?.charge_rate||0,quote_status:"none",month_label:s.month_label,visible_owner:true});
        await db.completeEntry(s.id);
      }
      setSubmitted(true);
    }catch(e){alert("Error: "+e.message);}
    setSubmitting(false);
  };

  if(submitted)return<Card style={{textAlign:"center",padding:48}}><div style={{fontSize:48,marginBottom:12}}>✅</div><div style={{fontSize:22,fontWeight:700,color:C.green,marginBottom:8}}>Visit complete</div><div style={{fontSize:14,color:C.mid,marginBottom:24}}>{done} tasks logged as events. Owner can now view results.</div><Btn onClick={()=>setView({page:"t_dash"})}>Back to schedule</Btn></Card>;
  if(!task)return null;

  return<div>
    <SectionHead title={date} sub={(current+1)+" of "+tasks.length+" · "+done+" logged"} back={()=>setView({page:"t_dash"})}/>
    <div style={{height:4,background:C.line,borderRadius:2,marginBottom:20}}><div style={{height:"100%",background:C.teal,borderRadius:2,width:((current+1)/tasks.length*100)+"%",transition:"width .3s"}}/></div>

function OwnerSchedule({user}){
  const[months,setMonths]=useState({});const[selMonth,setSelMonth]=useState(null);const[monthTasks,setMonthTasks]=useState([]);const[approving,setApproving]=useState(false);const[msg,setMsg]=useState("");const[loading,setLoading]=useState(true);const[expanded,setExpanded]=useState({});

  const approve=async()=>{setApproving(true);await db.approveMonth(propId,selMonth,user.id);setMonths(m=>({...m,[selMonth]:"approved"}));setMsg("Schedule approved ✓");setApproving(false);setTimeout(()=>setMsg(""),3000);};

      if(!groups[key])groups[key]={icon:areaIcon,name:areaName,areaId:key,tasks:[]};
      groups[key].tasks.push(s);

  const typeLabel={elec:"Electrical",hydro:"Water/Legionella",hvac:"HVAC",misc:"General",fire:"Fire",pest:"Pest",pool:"Pool"};

  return<div>

        <div style={{fontSize:10,color:sc.c,marginTop:3,fontWeight:600}}>{sc.l}</div>
      </div>;})}
    </div>
    {selMonth&&<div>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
        <div><div style={{fontWeight:700,fontSize:17}}>{selMonth}</div><div style={{fontSize:12,color:C.mid}}>Proposed visit date: {monthTasks[0]?.due_date||"TBC"}</div></div>
        <div>
          {months[selMonth]==="proposed"&&<Btn variant="green" onClick={approve} disabled={approving}>{approving?"Approving…":"Approve ✓"}</Btn>}
          {months[selMonth]==="approved"&&<span style={{padding:"6px 14px",borderRadius:20,background:C.greenL,color:C.green,fontSize:12,fontWeight:700}}>✓ Approved</span>}
          {months[selMonth]==="draft"&&<span style={{fontSize:12,color:C.mid,fontStyle:"italic"}}>Being prepared by PMS Malta</span>}
        </div>
      </div>
      {groupByArea(monthTasks).map(group=>{
        const isOpen=expanded[group.areaId];
        const hasAmber=group.tasks.some(t=>t.tasks?.type==="elec"||t.tasks?.type==="fire");
        return<Card key={group.areaId} style={{marginBottom:10}}>
          <div onClick={()=>toggleExpand(group.areaId)} style={{display:"flex",alignItems:"center",gap:12,cursor:"pointer"}}>
            <span style={{fontSize:24}}>{group.icon}</span>
            <div style={{flex:1}}>
              <div style={{fontWeight:700,fontSize:15}}>{group.name}</div>
              <div style={{fontSize:12,color:C.mid,marginTop:2}}>
                {group.tasks.length} maintenance tasks · tap to {isOpen?"collapse":"expand"}

              </div>
              {s.tasks?.charge_rate>0&&<span style={{fontSize:11,fontWeight:600,color:C.green,flexShrink:0}}>€{s.tasks.charge_rate}</span>}
            </div>)}
          </div>}
        </Card>;
      })}
      {months[selMonth]==="proposed"&&<div style={{marginTop:16,padding:"12px 16px",background:C.amberL,borderRadius:8,fontSize:13,color:C.amber}}>
        Please review the above and tap <b>Approve</b> to confirm this month's visit. If you have any questions contact Matthew on +356 79680343.
      </div>}
    </div>}
  </div>;

  admin:[{id:"a_dash",l:"Dashboard",i:"⊞"},{id:"a_cal",l:"Schedule",i:"📅"},{id:"a_events",l:"Events",i:"⚑"},{id:"a_manage",l:"Manage",i:"⚙️"}],
  tech: [{id:"t_dash",l:"My schedule",i:"📋"}],
  owner:[{id:"o_dash",l:"Properties",i:"🏨"},{id:"o_sched",l:"Schedule",i:"📅"},{id:"o_pend",l:"Actions",i:"⚑"},{id:"o_rep",l:"Reports",i:"📊"}],
};
const PCOL={admin:C.teal,tech:"#6366F1",owner:C.amber};

function App(){
  const[user,setUser]=useState(null);const[view,setView]=useState({page:"a_dash"});const[menu,setMenu]=useState(false);
  const login=u=>{setUser(u);const d={admin:"a_dash",tech:"t_dash",owner:"o_dash"};setView({page:d[u.role]});};
  const logout=()=>{setUser(null);setView({page:"a_dash"});};
  if(!user)return<Login onLogin={login}/>;
  const nav=NAVS[user.role]||[];const pc=PCOL[user.role];
  const isActive=nid=>{
    if(nid==="a_dash"&&(view.page.startsWith("a_prop")||view.page.startsWith("a_area")||view.page.startsWith("a_room")))return true;
    if(nid==="o_dash"&&(view.page.startsWith("o_prop")||view.page.startsWith("o_area")||view.page.startsWith("o_room")))return true;
    if(nid==="t_dash"&&view.page.startsWith("t_"))return true;
    return view.page===nid;
  };
  const content=()=>{switch(view.page){
    case "a_dash":   return<AdminDash setView={setView}/>;
    case "a_prop":   return<AdminProp propId={view.propId} setView={setView}/>;
    case "a_area":   return<AdminArea propId={view.propId} areaId={view.areaId} setView={setView}/>;
    case "a_room":   return<AdminRoom propId={view.propId} areaId={view.areaId} roomId={view.roomId} setView={setView}/>;
    case "a_cal":    return<AdminCal setView={setView}/>;
    case "a_events": return<AdminEvents/>;
    case "a_manage": return<AdminManage/>;
    case "t_dash":   return<TechDash user={user} setView={setView}/>;
    case "t_visit":  return<TechVisit date={view.date} tasks={view.tasks} user={user} setView={setView}/>;
    case "o_dash":   return<OwnerDash user={user} setView={setView}/>;
    case "o_prop":   return<OwnerProp user={user} propId={view.propId} setView={setView}/>;
    case "o_area":   return<OwnerArea user={user} propId={view.propId} areaId={view.areaId} setView={setView}/>;
    case "o_room":   return<OwnerRoom user={user} propId={view.propId} areaId={view.areaId} roomId={view.roomId} setView={setView}/>;
    case "o_sched":  return<OwnerSchedule user={user}/>;
    case "o_pend":   return<OwnerPending user={user}/>;
    case "o_rep":    return<OwnerReports user={user}/>;
    default: return null;
  }};
  return<div style={{fontFamily:"-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif",background:C.bg,minHeight:"100vh",display:"flex",flexDirection:"column"}}>
    <div style={{background:C.nav,padding:"0 16px",display:"flex",alignItems:"center",height:50,position:"sticky",top:0,zIndex:100}}>
      <button onClick={()=>setMenu(!menu)} style={{background:"none",border:"none",color:C.white,fontSize:20,cursor:"pointer",marginRight:12,padding:"0 4px"}}>☰</button>
      <div style={{color:C.white,fontWeight:800,fontSize:15,letterSpacing:-0.5,flex:1}}>PMS Malta</div>
      <div style={{padding:"3px 10px",borderRadius:20,background:pc,color:C.white,fontSize:11,fontWeight:600,marginRight:12}}>{user.role.charAt(0).toUpperCase()+user.role.slice(1)}</div>
      <button onClick={logout} style={{background:"rgba(255,255,255,0.1)",border:"none",color:"rgba(255,255,255,0.8)",padding:"4px 10px",borderRadius:6,fontSize:11,cursor:"pointer"}}>Sign out</button>
    </div>
    {menu&&<div style={{position:"fixed",top:50,left:0,bottom:0,right:0,zIndex:200,display:"flex"}}>
      <div style={{width:220,background:C.nav,padding:"20px 12px",overflowY:"auto"}}>
        <div style={{fontSize:10,fontWeight:700,color:"rgba(255,255,255,0.3)",marginBottom:10,paddingLeft:8,textTransform:"uppercase",letterSpacing:1}}>{user.role} portal</div>
        {nav.map(n=>{const active=isActive(n.id);return<button key={n.id} onClick={()=>{setView({page:n.id});setMenu(false);}} style={{display:"flex",alignItems:"center",gap:10,width:"100%",padding:"10px 8px",borderRadius:7,border:"none",cursor:"pointer",marginBottom:4,background:active?"rgba(255,255,255,0.12)":"transparent",color:active?C.white:"rgba(255,255,255,0.55)",fontSize:14,fontWeight:active?600:400,textAlign:"left"}}><span style={{fontSize:16}}>{n.i}</span>{n.l}</button>;})}
        <div style={{marginTop:20,borderTop:"1px solid rgba(255,255,255,0.1)",paddingTop:16}}><div style={{fontSize:11,color:"rgba(255,255,255,0.4)",padding:"6px 8px"}}>{user.name}</div><div style={{fontSize:11,color:"rgba(255,255,255,0.3)",padding:"0 8px 6px"}}>{user.email}</div></div>
      </div>
      <div style={{flex:1,background:"rgba(0,0,0,0.4)"}} onClick={()=>setMenu(false)}/>
    </div>}
    <div style={{flex:1,padding:16,overflowY:"auto"}}>{content()}</div>
    <div style={{background:C.nav,display:"flex",borderTop:"1px solid rgba(255,255,255,0.1)",position:"sticky",bottom:0}}>
      {nav.map(n=>{const active=isActive(n.id);return<button key={n.id} onClick={()=>setView({page:n.id})} style={{flex:1,padding:"10px 0",background:"transparent",border:"none",cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",gap:3}}><span style={{fontSize:18}}>{n.i}</span><span style={{fontSize:9,color:active?pc:"rgba(255,255,255,0.4)",fontWeight:active?700:400}}>{n.l}</span></button>;})}
    </div>
  </div>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
