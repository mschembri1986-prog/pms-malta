<body>
<div id="root"><div style="display:flex;align-items:center;justify-content:center;height:100vh;font-family:sans-serif;color:#64748B;">Loading PMS Malta…</div></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

<script>
'use strict';
const e=React.createElement;
const{useState,useEffect,useCallback}=React;

// ── SUPABASE ───────────────────────────────────────────────────────────────
const SUPA=supabase.createClient(
  "https://ingmfhuyyhlsdptuebpa.supabase.co",
  "sb_publishable_TKSTjRCws76fU9mBJtiCLw_-PdqKM0l"
);

// ── COLOURS ────────────────────────────────────────────────────────────────
const C={
  nav:"#0F1923",teal:"#1A7A6E",tealL:"#E6F4F2",
  amber:"#D4920A",amberL:"#FEF7E6",red:"#C0392B",redL:"#FDECEA",
  green:"#1A7A4A",greenL:"#E6F5ED",mid:"#64748B",
  line:"#E2E8F0",bg:"#F7F9FB",white:"#FFFFFF",text:"#0F1923",slate:"#2C3E50",
};
const RAG={
  green:{bg:C.greenL,text:C.green,border:C.green,dot:C.green,label:"Good"},
  amber:{bg:C.amberL,text:C.amber,border:C.amber,dot:C.amber,label:"Attention"},
  red:  {bg:C.redL,  text:C.red,  border:C.red,  dot:C.red,  label:"Urgent"},
};

// ── DB LAYER ───────────────────────────────────────────────────────────────
const db={
  async login(email,pw){
    const{data,error}=await SUPA.from("users").select("*").eq("email",email).eq("password",pw).single();
    return{data,error};
  },
  async getProperties(ids){
    let q=SUPA.from("properties").select("*");
    if(ids&&ids.length)q=q.in("id",ids);
    const{data}=await q;return data||[];
  },
  async getAreas(propId){
    const{data}=await SUPA.from("areas").select("*").eq("prop_id",propId).order("sort_order");
    return data||[];
  },
  async getRooms(propId,areaId){
    const{data}=await SUPA.from("rooms").select("*").eq("prop_id",propId).eq("area_id",areaId).order("name");
    return data||[];
  },
  async getUsers(){const{data}=await SUPA.from("users").select("*");return data||[];},
  async getTasksForArea(propId,areaId){
    const{data}=await SUPA.from("tasks").select("*").eq("prop_id",propId).eq("area_id",areaId).is("room_id",null).eq("active",true);
    return data||[];
  },
  async getEvents(f){
    f=f||{};
    let q=SUPA.from("events").select("*,tasks(ref,name,type,charge_rate,description),areas(name,icon),rooms(name,sub_name)").order("completed_at",{ascending:false});
    if(f.propId)q=q.eq("prop_id",f.propId);
    if(f.areaId)q=q.eq("area_id",f.areaId);
    if(f.roomId)q=q.eq("room_id",f.roomId);
    if(f.propIds&&f.propIds.length)q=q.in("prop_id",f.propIds);
    if(f.month)q=q.eq("month_label",f.month);
    const{data}=await q;return data||[];
  },
  async createEvent(d){
    const{error}=await SUPA.from("events").insert({id:"ev"+Date.now()+Math.floor(Math.random()*9999),...d});
    if(error)throw error;
  },
  async updateEvent(id,u){await SUPA.from("events").update(u).eq("id",id);},
  async getScheduleMonths(propId){
    const{data}=await SUPA.from("schedule").select("month_label,approval_status").eq("prop_id",propId);
    const map={};(data||[]).forEach(d=>{if(!map[d.month_label])map[d.month_label]=d.approval_status;});
    return map;
  },
  async getScheduleForMonth(propId,month){
    const{data}=await SUPA.from("schedule")
      .select("*,tasks(ref,name,type,est_minutes,bom,description,photo_req,charge_rate,grade),areas(name,icon),rooms(name,sub_name)")
      .eq("prop_id",propId).eq("month_label",month).order("due_date");
    return data||[];
  },
  async getTechSchedule(techId){
    const{data}=await SUPA.from("schedule")
      .select("*,tasks(ref,name,type,est_minutes,bom,description,photo_req,charge_rate,grade),areas(name,icon),rooms(name,sub_name)")
      .eq("tech_id",techId).eq("approval_status","approved").eq("status","scheduled").order("due_date");
    return data||[];
  },
  async getScheduleFallback(){
    const{data}=await SUPA.from("schedule")
      .select("*,tasks(ref,name,type,est_minutes,bom,description,photo_req,charge_rate,grade),areas(name,icon),rooms(name,sub_name)")
      .in("approval_status",["proposed","approved"]).eq("status","scheduled").order("due_date").limit(30);
    return data||[];
  },
  async approveMonth(propId,month,userId){
    await SUPA.from("schedule").update({approval_status:"approved",approved_by:userId,approved_at:new Date().toISOString()}).eq("prop_id",propId).eq("month_label",month);
  },
  async completeEntry(id){await SUPA.from("schedule").update({status:"complete"}).eq("id",id);},
  async uploadPhoto(file,path){
    const{error}=await SUPA.storage.from("visit-photos").upload(path,file,{upsert:true});
    if(error){console.error(error);return null;}
    const{data}=SUPA.storage.from("visit-photos").getPublicUrl(path);
    return data.publicUrl;
  },
  async addProperty(name,address,type){
    const id="p"+Date.now();
    await SUPA.from("properties").insert({id,name,address,type,rag:"green",room_count:0});return id;
  },
  async addArea(propId,name,icon,hasRooms){
    const id="a"+Date.now();
    await SUPA.from("areas").insert({id,prop_id:propId,name,icon:icon||"📋",has_rooms:hasRooms,rag:"green",sort_order:99});return id;
  },
  async addRoom(propId,areaId,name,subName){
    const id="r"+Date.now();
    await SUPA.from("rooms").insert({id,prop_id:propId,area_id:areaId,name,sub_name:subName,rag:"green"});return id;
  },
  async addUser(name,role,email,password,propIds){
    const id="u"+Date.now();
    const{error}=await SUPA.from("users").insert({id,name,role,email,password,prop_ids:propIds||[]});
    if(error)throw error;return id;
  },
  async addTask(d){
    const id="tk"+Date.now();
    const{error}=await SUPA.from("tasks").insert({id,...d,active:true});
    if(error)throw error;return id;
  },
};

// ── HELPERS ────────────────────────────────────────────────────────────────
function areaRag(events,areaId){
  const ae=events.filter(ev=>ev.area_id===areaId);
  if(ae.some(ev=>ev.rag==="red"))return"red";
  if(ae.some(ev=>ev.rag==="amber"))return"amber";
  return"green";
}
function roomRag(events,roomId){
  const re=events.filter(ev=>ev.room_id===roomId);
  if(re.some(ev=>ev.rag==="red"))return"red";
  if(re.some(ev=>ev.rag==="amber"))return"amber";
  return"green";
}

// ── UI PRIMITIVES ──────────────────────────────────────────────────────────
function RagDot({rag,size}){
  size=size||10;
  const r=RAG[rag];
  return e("span",{style:{display:"inline-block",width:size,height:size,borderRadius:"50%",background:r?r.dot:C.mid,flexShrink:0}});
}
function RagBadge({rag}){
  const r=RAG[rag];if(!r)return null;
  return e("span",{style:{display:"inline-flex",alignItems:"center",gap:5,padding:"3px 10px",borderRadius:20,background:r.bg,color:r.text,fontSize:11,fontWeight:600,border:"1px solid "+r.border,whiteSpace:"nowrap"}},
    e(RagDot,{rag,size:7}),r.label);
}
function TypeBadge({type}){
  const m={elec:"Electrical",hydro:"Water",hvac:"HVAC",misc:"General",fire:"Fire",pest:"Pest",pool:"Pool"};
  return e("span",{style:{padding:"2px 8px",borderRadius:4,background:"#EFF3F8",color:C.slate,fontSize:11}},(m[type]||type));
}
function StatusBadge({status}){
  const m={none:{bg:"#F1F5F9",c:C.mid,l:"No action"},requested:{bg:C.amberL,c:C.amber,l:"Quote requested"},sent:{bg:C.tealL,c:C.teal,l:"Quote sent"},approved:{bg:C.greenL,c:C.green,l:"Approved"},complete:{bg:C.greenL,c:C.green,l:"Complete"},scheduled:{bg:C.tealL,c:C.teal,l:"Scheduled"},proposed:{bg:C.amberL,c:C.amber,l:"Awaiting approval"},draft:{bg:"#F1F5F9",c:C.mid,l:"Being prepared"}};
  const s=m[status]||m.none;
  return e("span",{style:{padding:"2px 9px",borderRadius:20,background:s.bg,color:s.c,fontSize:11,fontWeight:600}},s.l);
}
function Spin(){return e("div",{style:{textAlign:"center",padding:40,color:C.mid,fontSize:14}},"Loading…");}
function Card({children,style,onClick}){
  return e("div",{onClick,style:Object.assign({background:C.white,border:"1px solid "+C.line,borderRadius:10,padding:16,cursor:onClick?"pointer":"default"},style||{})},children);
}
function Btn({children,onClick,variant,small,full,disabled}){
  variant=variant||"primary";
  const s={primary:{background:C.teal,color:C.white,border:"none"},secondary:{background:C.white,color:C.teal,border:"1.5px solid "+C.teal},ghost:{background:"transparent",color:C.mid,border:"1px solid "+C.line},green:{background:C.greenL,color:C.green,border:"1px solid "+C.green},amber:{background:C.amberL,color:C.amber,border:"1px solid "+C.amber}};
  return e("button",{onClick,disabled,style:Object.assign({},s[variant],{padding:small?"5px 12px":"8px 18px",borderRadius:7,fontSize:small?12:13,fontWeight:600,cursor:disabled?"not-allowed":"pointer",opacity:disabled?.5:1,display:"inline-flex",alignItems:"center",gap:6,width:full?"100%":"auto",justifyContent:full?"center":"flex-start"})},children);
}
function StatBox({label,value,rag}){
  return e("div",{style:{textAlign:"center",padding:"12px 0"}},
    e("div",{style:{fontSize:28,fontWeight:700,color:rag?RAG[rag].text:C.teal}},value!=null?value:0),
    e("div",{style:{fontSize:11,color:C.mid,marginTop:3}},label));
}
function Grid({cols,children,gap}){
  cols=cols||2;gap=gap||10;
  return e("div",{style:{display:"grid",gridTemplateColumns:"repeat("+cols+",1fr)",gap}},children);
}
function SectionHead({title,sub,action,back}){
  return e("div",{style:{marginBottom:20}},
    back&&e("button",{onClick:back,style:{background:"none",border:"none",color:C.teal,fontSize:13,cursor:"pointer",padding:"0 0 8px 0",display:"block"}},"← Back"),
    e("div",{style:{display:"flex",alignItems:"flex-start",justifyContent:"space-between"}},
      e("div",null,
        e("div",{style:{fontSize:19,fontWeight:700,color:C.text}},title),
        sub&&e("div",{style:{fontSize:12,color:C.mid,marginTop:2}},sub)),
      action));
}
function Inp({label,value,onChange,placeholder,type,rows}){
  type=type||"text";
  return e("div",{style:{marginBottom:12}},
    label&&e("label",{style:{fontSize:11,fontWeight:600,color:C.slate,display:"block",marginBottom:4}},label),
    rows?e("textarea",{value,onChange:ev=>onChange(ev.target.value),placeholder,rows,style:{width:"100%",padding:"8px 12px",borderRadius:7,border:"1px solid "+C.line,fontSize:13,outline:"none",resize:"vertical",fontFamily:"inherit"}})
        :e("input",{value,onChange:ev=>onChange(ev.target.value),placeholder,type,style:{width:"100%",padding:"8px 12px",borderRadius:7,border:"1px solid "+C.line,fontSize:13,outline:"none"}}));
}
function Sel({label,value,onChange,options}){
  return e("div",{style:{marginBottom:12}},
    label&&e("label",{style:{fontSize:11,fontWeight:600,color:C.slate,display:"block",marginBottom:4}},label),
    e("select",{value,onChange:ev=>onChange(ev.target.value),style:{width:"100%",padding:"8px 12px",borderRadius:7,border:"1px solid "+C.line,fontSize:13,outline:"none",background:"white"}},
      options.map(o=>e("option",{key:o.v,value:o.v},o.l))));
}

// ── EVENT CARD ─────────────────────────────────────────────────────────────
function EventCard({event:ev,showActions,onAction}){
  const[state,setState]=useState(ev.quote_status!=="none"?ev.quote_status:null);
  const act=async(val)=>{
    setState(val);
    await db.updateEvent(ev.id,{quote_status:val==="quote"?"requested":"none"});
    if(onAction)onAction();
  };
  const parts=[];
  parts.push(e("div",{key:"hd",style:{display:"flex",gap:8,marginBottom:6,alignItems:"center",flexWrap:"wrap"}},
    e(RagBadge,{rag:ev.rag}),
    e(TypeBadge,{type:ev.tasks&&ev.tasks.type}),
    ev.tasks&&e("span",{style:{fontSize:11,fontWeight:700,color:C.teal}},ev.tasks.ref),
    ev.areas&&e("span",{style:{fontSize:11,color:C.mid}},(ev.areas.icon||"")+" "+(ev.areas.name||"")+(ev.rooms?" · "+ev.rooms.name:"")),
    e("span",{style:{marginLeft:"auto",fontSize:11,color:C.mid}},ev.completed_at?ev.completed_at.slice(0,10):""))
  );
  parts.push(e("div",{key:"ti",style:{fontSize:14,fontWeight:600,marginBottom:4}},ev.title));
  if(ev.notes)parts.push(e("div",{key:"no",style:{fontSize:13,color:C.mid,marginBottom:6}},ev.notes));
  if(ev.photo_urls&&ev.photo_urls.filter(u=>u).length>0){
    parts.push(e("div",{key:"ph",style:{display:"flex",gap:6,marginBottom:8,flexWrap:"wrap"}},
      ev.photo_urls.filter(u=>u).map((url,i)=>e("img",{key:i,src:url,style:{width:72,height:72,objectFit:"cover",borderRadius:8,border:"1px solid "+C.line}}))));
  }
  if(showActions&&ev.rag!=="green"){
    if(!state||state==="none"){
      parts.push(e("div",{key:"ac",style:{display:"flex",gap:8,marginTop:6}},
        e(Btn,{key:"ack",small:true,variant:"ghost",onClick:()=>act("ack")},"Noted — no action"),
        e(Btn,{key:"qte",small:true,variant:"secondary",onClick:()=>act("quote")},"Request quote")));
    } else {
      parts.push(e("div",{key:"done",style:{padding:"6px 12px",borderRadius:6,background:state==="quote"||state==="requested"?C.amberL:C.greenL,color:state==="quote"||state==="requested"?C.amber:C.green,fontSize:12,fontWeight:600,display:"inline-block",marginTop:6}},
        state==="quote"||state==="requested"?"✓ Quote requested — PMS Malta will respond":"✓ Noted"));
    }
  }
  if(ev.rag==="green")parts.push(e("div",{key:"ok",style:{marginTop:4}},e("span",{style:{fontSize:11,color:C.green,fontWeight:600}},"✓ Task complete"+(ev.charge_amount>0?" · €"+ev.charge_amount+" charged":""))));
  return e("div",{style:{padding:"12px 0",borderBottom:"1px solid "+C.line}},parts);
}

// ── LOGIN ──────────────────────────────────────────────────────────────────
function Login({onLogin}){
  const[email,setEmail]=useState("");
  const[pass,setPass]=useState("");
  const[err,setErr]=useState("");
  const[loading,setLoading]=useState(false);
  const attempt=async()=>{
    if(!email||!pass){setErr("Enter email and password.");return;}
    setErr("");setLoading(true);
    const{data}=await db.login(email,pass);
    if(data)onLogin(data);else{setErr("Incorrect email or password.");setLoading(false);}
  };
  return e("div",{style:{minHeight:"100vh",background:C.nav,display:"flex",alignItems:"center",justifyContent:"center",padding:20}},
    e("div",{style:{background:C.white,borderRadius:16,padding:36,width:"100%",maxWidth:380}},
      e("div",{style:{textAlign:"center",marginBottom:28}},
        e("div",{style:{fontSize:26,fontWeight:800,color:C.teal,letterSpacing:-1}},"PMS Malta"),
        e("div",{style:{fontSize:12,color:C.mid,marginTop:4}},"Preventive Maintenance Services")),
      e(Inp,{label:"Email",value:email,onChange:setEmail,placeholder:"you@example.com",type:"email"}),
      e(Inp,{label:"Password",value:pass,onChange:setPass,placeholder:"••••••••",type:"password"}),
      err&&e("div",{style:{marginBottom:12,padding:"8px 12px",background:C.redL,color:C.red,borderRadius:6,fontSize:13}},err),
      e(Btn,{onClick:attempt,full:true,disabled:loading},loading?"Signing in…":"Sign in"),
      e("div",{style:{marginTop:20,fontSize:11,color:C.mid,textAlign:"center"}},"Contact your administrator if you need access.")));
}

// ── ADMIN DASHBOARD ────────────────────────────────────────────────────────
function AdminDash({setView}){
  const[props,setProps]=useState([]);
  const[events,setEvents]=useState([]);
  const[loading,setLoading]=useState(true);
  useEffect(()=>{
    Promise.all([db.getProperties(),db.getEvents()]).then(([p,ev])=>{setProps(p);setEvents(ev);setLoading(false);});
  },[]);
  if(loading)return e(Spin,null);
  const reds=events.filter(ev=>ev.rag==="red").length;
  const ambers=events.filter(ev=>ev.rag==="amber").length;
  return e("div",null,
    e(SectionHead,{title:"Dashboard",sub:"All properties · live status"}),
    e(Grid,{cols:4,gap:10},
      e(Card,null,e(StatBox,{label:"Properties",value:props.length})),
      e(Card,null,e(StatBox,{label:"Total events",value:events.length})),
      e(Card,null,e(StatBox,{label:"Urgent",value:reds,rag:"red"})),
      e(Card,null,e(StatBox,{label:"Attention",value:ambers,rag:"amber"}))),
    e("div",{style:{height:14}}),
    props.map(p=>{
      const pe=events.filter(ev=>ev.prop_id===p.id);
      const pr=pe.some(ev=>ev.rag==="red")?"red":pe.some(ev=>ev.rag==="amber")?"amber":"green";
      return e(Card,{key:p.id,onClick:()=>setView({page:"a_prop",propId:p.id}),style:{marginBottom:12}},
        e("div",{style:{display:"flex",justifyContent:"space-between",marginBottom:8}},
          e("div",null,e("div",{style:{fontWeight:700,fontSize:15}},p.name),e("div",{style:{fontSize:12,color:C.mid}},p.type+" · "+p.room_count+" rooms")),
          e(RagBadge,{rag:pr})),
        e("div",{style:{display:"flex",gap:14,fontSize:12}},
          e("span",{style:{color:C.red}},"✕ "+pe.filter(ev=>ev.rag==="red").length+" urgent"),
          e("span",{style:{color:C.amber}},"⚠ "+pe.filter(ev=>ev.rag==="amber").length+" amber"),
          e("span",{style:{color:C.green}},"✓ "+pe.filter(ev=>ev.rag==="green").length+" good")));
    }),
    e(Card,{style:{marginTop:4}},
      e("div",{style:{fontWeight:700,fontSize:14,marginBottom:12}},"Urgent events"),
      events.filter(ev=>ev.rag==="red").length===0
        ?e("div",{style:{fontSize:13,color:C.mid}},"No urgent events.")
        :events.filter(ev=>ev.rag==="red").slice(0,5).map(ev=>e("div",{key:ev.id,style:{display:"flex",alignItems:"center",gap:8,padding:"8px 0",borderBottom:"1px solid "+C.line,flexWrap:"wrap"}},
            e(RagBadge,{rag:ev.rag}),e(TypeBadge,{type:ev.tasks&&ev.tasks.type}),
            e("span",{style:{flex:1,fontSize:13}},ev.title)))));
}

// ── ADMIN PROPERTY ─────────────────────────────────────────────────────────
function AdminProp({propId,setView}){
  const[prop,setProp]=useState(null);
  const[areas,setAreas]=useState([]);
  const[events,setEvents]=useState([]);

      e(Card,null,e(StatBox,{label:"Events",value:events.length})),
      e(Card,null,e(StatBox,{label:"Urgent",value:events.filter(ev=>ev.rag==="red").length,rag:"red"})),
      e(Card,null,e(StatBox,{label:"Attention",value:events.filter(ev=>ev.rag==="amber").length,rag:"amber"})),
      e(Card,null,e(StatBox,{label:"Complete",value:events.filter(ev=>ev.rag==="green").length,rag:"green"}))),
    e("div",{style:{fontWeight:700,fontSize:14,margin:"16px 0 10px"}},"Areas"),

          e("div",{style:{fontWeight:600,fontSize:14,marginTop:8}},a.name),
          e("div",{style:{fontSize:11,color:C.mid,marginTop:4,display:"flex",gap:10}},

            e("span",{style:{color:C.amber}},"⚠ "+events.filter(ev=>ev.area_id===a.id&&ev.rag==="amber").length),
            e("span",{style:{color:C.green}},"✓ "+events.filter(ev=>ev.area_id===a.id&&ev.rag==="green").length)));
      })));
}

// ── ADMIN AREA ─────────────────────────────────────────────────────────────
function AdminArea({propId,areaId,setView}){
  const[prop,setProp]=useState(null);const[area,setArea]=useState(null);
  const[rooms,setRooms]=useState([]);const[events,setEvents]=useState([]);
  const[tasks,setTasks]=useState([]);const[tab,setTab]=useState("events");const[loading,setLoading]=useState(true);
  useEffect(()=>{
    Promise.all([db.getProperties([propId]),db.getAreas(propId),db.getRooms(propId,areaId),db.getEvents({propId,areaId}),db.getTasksForArea(propId,areaId)]).then(([ps,areas,r,ev,t])=>{
      setProp(ps[0]);setArea(areas.find(a=>a.id===areaId));setRooms(r);setEvents(ev);setTasks(t);setLoading(false);});

    e(SectionHead,{title:"Monthly reports",sub:"PPM event reports by month",action:selMonth?e(Btn,{variant:"ghost",small:true,onClick:()=>setSelMonth(null)},"← All months"):null}),
    !selMonth&&e("div",null,
      months.length===0&&e(Card,null,e("div",{style:{textAlign:"center",padding:32,color:C.mid}},"Reports appear here after visits are completed.")),
      months.map(m=>{
        const me=events.filter(ev=>ev.month_label===m);
        const charged=me.reduce((s,ev)=>s+Number(ev.charge_amount||0),0);
        return e(Card,{key:m,style:{marginBottom:14}},
          e("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}},e("div",{style:{fontSize:16,fontWeight:700}},m),charged>0&&e("span",{style:{fontWeight:700,color:C.teal}},"€"+charged)),
          e("div",{style:{display:"flex",gap:14,fontSize:12,marginBottom:14}},e("span",null,me.length+" events"),e("span",{style:{color:C.green}},"✓ "+me.filter(ev=>ev.rag==="green").length+" complete"),e("span",{style:{color:C.amber}},"⚠ "+me.filter(ev=>ev.rag==="amber").length+" amber"),e("span",{style:{color:C.red}},"✕ "+me.filter(ev=>ev.rag==="red").length+" urgent")),
          e("div",{style:{display:"flex",gap:8}},e(Btn,{variant:"secondary",small:true,onClick:()=>setSelMonth(m)},"View events"),e(Btn,{variant:"ghost",small:true,onClick:()=>exportCSV(m)},"Export CSV ↓")));
      })),
    selMonth&&e("div",null,
      e("div",{style:{fontWeight:700,fontSize:16,marginBottom:4}},selMonth),
      e("div",{style:{fontSize:12,color:C.mid,marginBottom:16}},monthEvents.length+" events logged"),
      monthEvents.length===0&&e(Card,null,e("div",{style:{textAlign:"center",padding:32,color:C.mid}},"No events recorded for this month.")),
      monthEvents.map(ev=>e(Card,{key:ev.id,style:{marginBottom:10}},
        e("div",{style:{display:"flex",gap:8,marginBottom:6,flexWrap:"wrap",alignItems:"center"}},
          e(RagBadge,{rag:ev.rag}),e("span",{style:{fontSize:11,color:C.mid}},(ev.areas&&ev.areas.icon||"")+" "+(ev.areas&&ev.areas.name||"")+(ev.rooms?" · "+ev.rooms.name:"")),e("span",{style:{marginLeft:"auto",fontSize:11,color:C.mid}},ev.completed_at?ev.completed_at.slice(0,10):"")),
        e("div",{style:{fontSize:14,fontWeight:600,marginBottom:4}},ev.title),
        ev.notes&&e("div",{style:{fontSize:13,color:C.mid,marginBottom:6}},ev.notes),
        ev.photo_urls&&ev.photo_urls.filter(u=>u).length>0&&e("div",{style:{display:"flex",gap:6,flexWrap:"wrap",marginTop:6}},ev.photo_urls.filter(u=>u).map((url,i)=>e("img",{key:i,src:url,style:{width:72,height:72,objectFit:"cover",borderRadius:8,border:"1px solid "+C.line}}))))),
      e("div",{style:{marginTop:16}},e(Btn,{variant:"secondary",onClick:()=>exportCSV(selMonth)},"Export this month as CSV ↓"))));
}

// ── NAV CONFIG ─────────────────────────────────────────────────────────────
const NAVS={
  admin:[{id:"a_dash",l:"Dashboard",i:"⊞"},{id:"a_cal",l:"Schedule",i:"📅"},{id:"a_events",l:"Events",i:"⚑"},{id:"a_manage",l:"Manage",i:"⚙️"}],
  tech: [{id:"t_dash",l:"My schedule",i:"📋"}],
  owner:[{id:"o_dash",l:"Properties",i:"🏨"},{id:"o_sched",l:"Schedule",i:"📅"},{id:"o_pend",l:"Actions",i:"⚑"},{id:"o_rep",l:"Reports",i:"📊"}],
};
const PCOL={admin:C.teal,tech:"#6366F1",owner:C.amber};

// ── APP ROOT ───────────────────────────────────────────────────────────────
function App(){
  const[user,setUser]=useState(null);
  const[view,setView]=useState({page:"a_dash"});
  const[menu,setMenu]=useState(false);
  const login=u=>{setUser(u);const d={admin:"a_dash",tech:"t_dash",owner:"o_dash"};setView({page:d[u.role]});};
  const logout=()=>{setUser(null);setView({page:"a_dash"});};
  if(!user)return e(Login,{onLogin:login});
  const nav=NAVS[user.role]||[];const pc=PCOL[user.role];
  const isActive=nid=>{
    if(nid==="a_dash"&&(view.page.startsWith("a_prop")||view.page.startsWith("a_area")||view.page.startsWith("a_room")))return true;
    if(nid==="o_dash"&&(view.page.startsWith("o_prop")||view.page.startsWith("o_area")||view.page.startsWith("o_room")))return true;
    if(nid==="t_dash"&&view.page.startsWith("t_"))return true;
    return view.page===nid;
  };
  const content=()=>{
    switch(view.page){
      case"a_dash":   return e(AdminDash,{setView});
      case"a_prop":   return e(AdminProp,{propId:view.propId,setView});
      case"a_area":   return e(AdminArea,{propId:view.propId,areaId:view.areaId,setView});
      case"a_room":   return e(AdminRoom,{propId:view.propId,areaId:view.areaId,roomId:view.roomId,setView});
      case"a_cal":    return e(AdminCal,null);
      case"a_events": return e(AdminEvents,null);
      case"a_manage": return e(AdminManage,null);
      case"t_dash":   return e(TechDash,{user,setView});
      case"t_visit":  return e(TechVisit,{date:view.date,tasks:view.tasks,user,setView});
      case"o_dash":   return e(OwnerDash,{user,setView});
      case"o_prop":   return e(OwnerProp,{user,propId:view.propId,setView});
      case"o_area":   return e(OwnerArea,{user,propId:view.propId,areaId:view.areaId,setView});
      case"o_room":   return e(OwnerRoom,{user,propId:view.propId,areaId:view.areaId,roomId:view.roomId,setView});
      case"o_sched":  return e(OwnerSchedule,{user});
      case"o_pend":   return e(OwnerPending,{user});
      case"o_rep":    return e(OwnerReports,{user});
      default:return null;
    }
  };
  return e("div",{style:{fontFamily:"-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif",background:C.bg,minHeight:"100vh",display:"flex",flexDirection:"column"}},
    e("div",{style:{background:C.nav,padding:"0 16px",display:"flex",alignItems:"center",height:50,position:"sticky",top:0,zIndex:100}},
      e("button",{onClick:()=>setMenu(!menu),style:{background:"none",border:"none",color:C.white,fontSize:20,cursor:"pointer",marginRight:12,padding:"0 4px"}},"☰"),
      e("div",{style:{color:C.white,fontWeight:800,fontSize:15,letterSpacing:-0.5,flex:1}},"PMS Malta"),
      e("div",{style:{padding:"3px 10px",borderRadius:20,background:pc,color:C.white,fontSize:11,fontWeight:600,marginRight:12}},user.role.charAt(0).toUpperCase()+user.role.slice(1)),
      e("button",{onClick:logout,style:{background:"rgba(255,255,255,0.1)",border:"none",color:"rgba(255,255,255,0.8)",padding:"4px 10px",borderRadius:6,fontSize:11,cursor:"pointer"}},"Sign out")),
    menu&&e("div",{style:{position:"fixed",top:50,left:0,bottom:0,right:0,zIndex:200,display:"flex"}},
      e("div",{style:{width:220,background:C.nav,padding:"20px 12px",overflowY:"auto"}},
        e("div",{style:{fontSize:10,fontWeight:700,color:"rgba(255,255,255,0.3)",marginBottom:10,paddingLeft:8,textTransform:"uppercase",letterSpacing:1}},user.role+" portal"),
        nav.map(n=>{const active=isActive(n.id);return e("button",{key:n.id,onClick:()=>{setView({page:n.id});setMenu(false);},style:{display:"flex",alignItems:"center",gap:10,width:"100%",padding:"10px 8px",borderRadius:7,border:"none",cursor:"pointer",marginBottom:4,background:active?"rgba(255,255,255,0.12)":"transparent",color:active?C.white:"rgba(255,255,255,0.55)",fontSize:14,fontWeight:active?600:400,textAlign:"left"}},e("span",{style:{fontSize:16}},n.i),n.l);}),
        e("div",{style:{marginTop:20,borderTop:"1px solid rgba(255,255,255,0.1)",paddingTop:16}},
          e("div",{style:{fontSize:11,color:"rgba(255,255,255,0.4)",padding:"6px 8px"}},user.name),
          e("div",{style:{fontSize:11,color:"rgba(255,255,255,0.3)",padding:"0 8px 6px"}},user.email))),
      e("div",{style:{flex:1,background:"rgba(0,0,0,0.4)"},onClick:()=>setMenu(false)})),
    e("div",{style:{flex:1,padding:16,overflowY:"auto"}},content()),
    e("div",{style:{background:C.nav,display:"flex",borderTop:"1px solid rgba(255,255,255,0.1)",position:"sticky",bottom:0}},
      nav.map(n=>{const active=isActive(n.id);return e("button",{key:n.id,onClick:()=>setView({page:n.id}),style:{flex:1,padding:"10px 0",background:"transparent",border:"none",cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",gap:3}},
        e("span",{style:{fontSize:18}},n.i),e("span",{style:{fontSize:9,color:active?pc:"rgba(255,255,255,0.4)",fontWeight:active?700:400}},n.l));})));
}

ReactDOM.createRoot(document.getElementById("root")).render(e(App,null));
</script>
</body>
</html>
